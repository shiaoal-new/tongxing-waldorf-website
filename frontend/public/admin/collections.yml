- name: "faculty"
  label: "教職員名單"
  folder: "src/data/faculty"
  extension: "yml"
  format: "yml"
  delete: true
  create: true
  identifier_field: title
  summary: "{{title}} - {{subtitle}}"
  fields:
    - { label: "姓名", name: "title", widget: "string", required: true }
    - { label: "職稱", name: "subtitle", widget: "string", required: true }
    - &media_field # 定義可重用的媒體欄位錨點
      label: "媒體資源"
      name: "media"
      widget: "object"
      required: false
      summary: "{{type}}"
      fields: &media_inner_fields
        - label: "媒體類型"
          name: "type"
          widget: "select"
          options:
            - { label: "🖼️ 圖片", value: "image" }
            - { label: "🎥 影片檔", value: "video" }
            - { label: "📽️ YouTube", value: "youtube" }
            - { label: "✨ Lottie 動畫", value: "lottie" }
          default: "image"
          required: false
        - { label: "圖片文件", name: "image", widget: "image", required: false }
        - { label: "影片文件", name: "video", widget: "file", required: false }
        - {
            label: "影片封面圖 (Poster)",
            name: "poster",
            widget: "image",
            required: false,
            hint: "視頻加載時顯示的占位圖片",
          }
        - {
            label: "Lottie 文件",
            name: "lottie",
            widget: "file",
            required: false,
          }
        - {
            label: "URL / YouTube ID / Lottie ID",
            name: "url",
            widget: "string",
            required: false,
          }
        - {
            label: "替代文字 (Alt)",
            name: "alt",
            widget: "string",
            required: false,
          }
    - { label: "電子郵件", name: "email", widget: "email", required: false }
    - {
        label: "辦公室分機",
        name: "extension",
        widget: "string",
        required: false,
      }
    - {
        label: "教師群組",
        name: "group",
        widget: "select",
        options:
          [
            { label: "專任教師", value: "full_time" },
            { label: "行政教師", value: "admin" },
            { label: "兼任教師", value: "part_time" },
          ],
        default: "full_time",
      }
    - { label: "學歷背景", name: "education", widget: "text", required: false }
    - {
        label: "專業背景/經歷",
        name: "experience",
        widget: "text",
        required: false,
      }
    - {
        label: "簡介/核心價值",
        name: "content",
        widget: "markdown",
        required: false,
      }
    - label: "專業領域"
      name: "expertise"
      widget: "list"
      collapsed: true
      summary: "{{area}}"
      fields:
        - { label: "領域名稱", name: "area", widget: "string" }
    - {
        label: "顯示順序",
        name: "order",
        widget: "number",
        value_type: "int",
        min: 0,
      }

- name: "faq"
  label: "常見問答"
  folder: "src/data/faq"
  extension: "yml"
  format: "yml"
  delete: true
  create: true
  identifier_field: title
  summary: "{{title}}"
  fields:
    - { label: "問題 (標題)", name: "title", widget: "string", required: true }
    - {
        label: "答案 (內容)",
        name: "content",
        widget: "markdown",
        required: true,
      }
    - {
        label: "顯示順序",
        name: "order",
        widget: "number",
        value_type: "int",
        min: 0,
        default: 0,
        hint: "數字越小越前面",
      }

- name: "pages"
  label: "頁面管理 (Page Builder)"
  folder: "src/data/pages"
  extension: "yml"
  format: "yml"
  create: true
  identifier_field: title
  summary: "{{title}} ({{slug}})"
  fields:
    - {
        label: "頁面名稱",
        name: "title",
        widget: "string",
        hint: "僅供後台識別使用",
      }
    - {
        label: "網址路徑 (Slug)",
        name: "slug",
        widget: "string",
        hint: "例如：about-us。這會決定網址的最後一部分",
      }
    - label: "頁面最上方英雄區塊 (Hero)"
      name: "hero"
      widget: "object"
      collapsed: true
      required: false
      fields:
        - &layout_field {
            label: "🎨 版面風格模板",
            name: "layout",
            widget: "relation",
            collection: "section_layouts",
            search_fields: ["title"],
            value_field: "title",
            display_fields: ["title"],
            required: false,
          }
        - &title_field {
            label: "大標題",
            name: "title",
            widget: "string",
            required: false,
          }
        - &subtitle_field {
            label: "小標題",
            name: "subtitle",
            widget: "string",
            required: false,
          }
        - &content_field {
            label: "描述內容/內文",
            name: "content",
            widget: "markdown",
            required: false,
          }
        - &media_list_field
          label: "背景媒體列表 (Carousel)"
          name: "media_list"
          widget: "list"
          summary: "{{type}}"
          fields: *media_inner_fields
        - &parallax_field {
            label: "視差滾動速率 (0~2)",
            name: "parallax_ratio",
            widget: "number",
            value_type: "float",
            default: 0,
            min: 0,
            max: 2,
            step: 0.1,
            hint: "0=固定背景(Fixed), 1=隨頁面捲動(Static), 0.5=半速視差",
            required: false,
          }
        - {
            label: "捲動特效 (Scrolling Effect)",
            name: "scrolling_effect",
            widget: "select",
            options:
              [
                { label: "無特效 (None)", value: "none" },
                { label: "漸變至黑 (Fade to Dark)", value: "fadeToDark" },
                { label: "漸變至白 (Fade to White)", value: "fadeToWhite" },
              ],
            default: "fadeToWhite",
            required: false,
            hint: "選擇向下捲動時的背景漸變效果",
          }
        - label: "進入特效 (Entry Effect)"
          name: "entry_effect"
          widget: "object"
          collapsed: true
          required: false
          fields:
            - {
                label: "特效類型",
                name: "type",
                widget: "select",
                options:
                  [
                    { label: "無 (None)", value: "none" },
                    {
                      label: "背景漸暗 (Background Dim)",
                      value: "fade_to_dim",
                    },
                  ],
                default: "fade_to_dim",
              }
            - {
                label: "延遲啟動 (秒)",
                name: "delay",
                widget: "number",
                value_type: "float",
                default: 1,
                min: 0,
                step: 0.1,
              }
            - {
                label: "漸變時長 (秒)",
                name: "duration",
                widget: "number",
                value_type: "float",
                default: 2,
                min: 0,
                step: 0.1,
              }
            - {
                label: "結束亮度 (0~1)",
                name: "brightness",
                widget: "number",
                value_type: "float",
                default: 0.4,
                min: 0,
                max: 1,
                step: 0.05,
                hint: "1=不變暗, 0=全黑, 0.6=常見適中亮度",
              }
    - label: "SEO 設定 (Search Engine Optimization)"
      name: "seo"
      widget: "object"
      collapsed: true
      required: false
      fields:
        - {
            label: "SEO 標題 (Title)",
            name: "title",
            widget: "string",
            required: false,
            hint: "若留空則使用頁面標題",
          }
        - {
            label: "SEO 描述 (Description)",
            name: "description",
            widget: "text",
            required: false,
            hint: "若留空則使用 Hero 內容或預設描述",
          }
        - {
            label: "關鍵字 (Keywords)",
            name: "keywords",
            widget: "string",
            required: false,
          }
        - {
            label: "社群分享預覽圖 (OG Image)",
            name: "ogImage",
            widget: "image",
            required: false,
            hint: "建議尺寸 1200x630",
          }
    - label: "頁面內容段落 (Sections)"
      name: "sections"
      widget: "list"
      summary: "{{section_id}} ({{layout}})"
      fields:
        - *layout_field
        - {
            label: "段落識別 ID",
            name: "section_id",
            widget: "string",
            required: false,
            hint: "用於錨點連結，例如 'about'",
          }
        - *media_list_field
        - *parallax_field
        - label: "區塊內容 (Blocks)"
          name: "blocks"
          widget: "list"
          types:
            - label: "📄 純文字/介紹區塊"
              name: "text_block"
              widget: "object"
              fields:
                - *title_field
                - *subtitle_field
                - *content_field
                - label: "下方行動按鈕 (Actions)"
                  name: "buttons"
                  widget: "list"
                  collapsed: true
                  summary: "{{text}}"
                  fields: &button_fields
                    - { label: "按鈕文字", name: "text", widget: "string" }
                    - { label: "連結網址", name: "link", widget: "string" }
                    - {
                        label: "按鈕顏色",
                        name: "style",
                        widget: "select",
                        options: ["btn-primary", "btn-secondary", "btn-white"],
                        default: "btn-primary",
                      }
            - label: "📦 通用列表區塊 (特色/影音/FAQ)"
              name: "list_block"
              widget: "object"
              fields:
                - {
                    label: "選擇常見問答 (可選)",
                    name: "faq_ids",
                    widget: "relation",
                    collection: "faq",
                    multiple: true,
                    value_field: "id",
                    display_fields: ["title"],
                    search_fields: ["title"],
                    required: false,
                  }
                - {
                    label: "📐 排列方向",
                    name: "direction",
                    widget: "select",
                    options:
                      [
                        { label: "橫向 (Horizontal)", value: "horizontal" },
                        { label: "縱向 (Vertical)", value: "vertical" },
                      ],
                    default: "horizontal",
                    hint: "橫向適合 benefit/video,縱向適合 FAQ/accordion",
                  }
                - {
                    label: "� 佈局方式 (Layout)",
                    name: "layout",
                    widget: "select",
                    options:
                      [
                        {
                          label: "可滾動網格 (Scrollable Grid)",
                          value: "scrollable_grid",
                        },
                        {
                          label: "三欄網格卡片 (Grid Cards)",
                          value: "grid_cards",
                        },
                        { label: "縱向清單 (Vertical)", value: "vertical" },
                        { label: "雜誌風 Bento 網格", value: "bento_grid" },
                        {
                          label: "緊湊網格 (Compact Grid)",
                          value: "compact_grid",
                        },
                        {
                          label: "橫向滾動 (Horizontal Scroll)",
                          value: "horizontal_scroll",
                        },
                        { label: "輪播圖 (Carousel)", value: "carousel" },
                        { label: "瀑布流 (Masonry)", value: "masonry_grid" },
                      ],
                    default: "scrollable_grid",
                  }
                - {
                    label: "項目類型",
                    name: "item_type",
                    widget: "select",
                    options:
                      [
                        { label: "常見問答 (FAQ)", value: "faq_item" },
                        { label: "純文字/折疊內容", value: "text" },
                        { label: "教育特色 (Benefit)", value: "benefit_item" },
                        { label: "影片 (Video)", value: "video_item" },
                        { label: "卡片 (Card)", value: "card_item" },
                        {
                          label: "紧凑卡片 (Compact Card)",
                          value: "compact_card_item",
                        },
                      ],
                    default: "benefit_item",
                    required: false,
                    hint: "决定项目的渲染样式。text 適合垂直折疊, benefit_item/video_item 适合 scrollable_grid, card_item 适合 grid_cards, compact_card_item 适合紧凑网格",
                  }
                - label: "列表項目"
                  name: "items"
                  widget: "list"
                  collapsed: true
                  summary: "{{title}}"
                  fields:
                    - *title_field
                    - *subtitle_field
                    - *content_field
                    - *media_field # 重用媒體欄位定義
                    - label: "次級小清單 (選填)"
                      name: "sub_items"
                      widget: "list"
                      collapsed: true
                      summary: "{{title}}"
                      fields:
                        - {
                            label: "小標題",
                            name: "title",
                            widget: "string",
                            required: false,
                          }
                        - { label: "小描述", name: "content", widget: "text" }
                        - { label: "小圖示 ID", name: "icon", widget: "string" }
                - label: "區塊底部按鈕"
                  name: "buttons"
                  widget: "list"
                  collapsed: true
                  summary: "{{text}}"
                  fields: *button_fields
            - label: "👥 成員/教職員名單區塊"
              name: "member_block"
              widget: "object"
              fields:
                - {
                    label: "選擇教職員 (可複選)",
                    name: "members",
                    widget: "relation",
                    collection: "faculty",
                    multiple: true,
                    value_field: "name",
                    display_fields: ["name"],
                    search_fields: ["name"],
                  }
            - label: "📅 課程作息區塊"
              name: "schedule_block"
              widget: "object"
              fields:
                - label: "中低年級作息 (1-4年級)"
                  name: "low"
                  widget: "list"
                  collapsed: true
                  summary: "{{time}} - {{title}}"
                  fields:
                    - { label: "時間", name: "time", widget: "string" }
                    - { label: "標題", name: "title", widget: "string" }
                    - { label: "描述", name: "content", widget: "text" }
                    - label: "呼吸類型"
                      name: "type"
                      widget: "select"
                      options:
                        - { label: "吸氣 (In)", value: "in" }
                        - { label: "吐氣 (Out)", value: "out" }
                - label: "高年級作息 (5-9年級)"
                  name: "high"
                  widget: "list"
                  collapsed: true
                  summary: "{{time}} - {{title}}"
                  fields:
                    - { label: "時間", name: "time", widget: "string" }
                    - { label: "標題", name: "title", widget: "string" }
                    - { label: "描述", name: "content", widget: "text" }
                    - label: "呼吸類型"
                      name: "type"
                      widget: "select"
                      options:
                        - { label: "吸氣 (In)", value: "in" }
                        - { label: "吐氣 (Out)", value: "out" }
            - label: "📜 課程發展圖像區塊"
              name: "curriculum_block"
              widget: "object"
              fields:
                - {
                    label: "標題備註",
                    name: "note",
                    widget: "string",
                    required: false,
                    hint: "僅供後台備註",
                  }
            - label: "🎨 品牌調色盤區塊"
              name: "color_palette_block"
              widget: "object"
              fields:
                - *title_field
                - *subtitle_field
                - *content_field

- name: "section_layouts"
  label: "版面模板管理 (Developers Only)"
  folder: "src/data/section_layouts"
  extension: "yml"
  format: "yml"
  create: true
  identifier_field: title
  summary: "{{title}}"
  fields:
    - { label: "模板名稱", name: "title", widget: "string", required: true }
    - label: "CSS 類別定義"
      name: "css_classes"
      widget: "text"
      hint: "請使用 .class_name { classes } 語法"

- name: "settings"
  label: "全站設定"
  delete: false
  editor:
    preview: false
  files:
    - name: "navigation"
      label: "標題選單 (Header Menu)"
      file: "src/data/settings/navigation.yml"
      fields:
        - label: "選單項目"
          name: "items"
          widget: "list"
          summary: "{{title}} {{slug}} {{path}}"
          fields:
            - {
                label: "關聯頁面 (Slug)",
                name: "slug",
                widget: "relation",
                collection: "pages",
                search_fields: ["title", "slug"],
                value_field: "slug",
                display_fields: ["title"],
                required: false,
              }
            - {
                label: "顯示名稱",
                name: "title",
                widget: "string",
                required: false,
                hint: "若有指定『關聯頁面』且此欄留空，將使用該頁面的標題",
              }
            - {
                label: "自定義連結",
                name: "path",
                widget: "string",
                required: false,
                hint: "例如：/visit。若有指定『關聯頁面』且此欄留空，將自動生成路徑",
              }
            - label: "子選單"
              name: "children"
              widget: "list"
              required: false
              summary: "{{title}} {{slug}} {{path}}"
              fields:
                - {
                    label: "關聯頁面 (Slug)",
                    name: "slug",
                    widget: "relation",
                    collection: "pages",
                    search_fields: ["title", "slug"],
                    value_field: "slug",
                    display_fields: ["title"],
                    required: false,
                  }
                - {
                    label: "顯示名稱",
                    name: "title",
                    widget: "string",
                    required: false,
                  }
                - {
                    label: "自定義連結",
                    name: "path",
                    widget: "string",
                    required: false,
                  }
                - label: "二級子選單 (可選)"
                  name: "children"
                  widget: "list"
                  required: false
                  summary: "{{title}} {{slug}} {{path}}"
                  fields:
                    - {
                        label: "關聯頁面",
                        name: "slug",
                        widget: "relation",
                        collection: "pages",
                        search_fields: ["title", "slug"],
                        value_field: "slug",
                        display_fields: ["title"],
                        required: false,
                      }
                    - {
                        label: "顯示名稱",
                        name: "title",
                        widget: "string",
                        required: false,
                      }
                    - {
                        label: "自定義連結",
                        name: "path",
                        widget: "string",
                        required: false,
                      }
            - name: "site_settings"
              label: "網站基本設定 (Site Info)"
              file: "src/data/settings/site-settings.yml"
              fields:
                - { label: "網站名稱", name: "name", widget: "string" }
                - { label: "網址", name: "url", widget: "string" }
                - { label: "Logo 路徑", name: "logo", widget: "image" }
                - { label: "網站描述", name: "description", widget: "text" }
                - label: "地址資訊"
                  name: "address"
                  widget: "object"
                  fields:
                    - {
                        label: "地址 (Street)",
                        name: "streetAddress",
                        widget: "string",
                      }
                    - {
                        label: "區 (Locality)",
                        name: "addressLocality",
                        widget: "string",
                      }
                    - {
                        label: "城市 (Region)",
                        name: "addressRegion",
                        widget: "string",
                      }
                    - {
                        label: "郵遞區號",
                        name: "postalCode",
                        widget: "string",
                      }
                    - {
                        label: "國家代碼",
                        name: "addressCountry",
                        widget: "string",
                      }
                - label: "聯絡資訊"
                  name: "contact"
                  widget: "object"
                  fields:
                    - { label: "電話", name: "telephone", widget: "string" }
                    - { label: "Email", name: "email", widget: "string" }
                - label: "社群連結"
                  name: "socialLinks"
                  widget: "object"
                  fields:
                    - {
                        label: "Facebook",
                        name: "facebook",
                        widget: "string",
                        required: false,
                      }
                    - {
                        label: "Instagram",
                        name: "instagram",
                        widget: "string",
                        required: false,
                      }
                    - {
                        label: "YouTube",
                        name: "youtube",
                        widget: "string",
                        required: false,
                      }
