title: "Hero: 左下方文字方塊 (首頁風格)"
css_classes: |
  .wrapper_class { relative z-20 flex flex-col items-start w-full px-mobile-margin md:px-desktop-margin pb-mobile-margin md:pb-desktop-margin mt-auto mb-10 short:mb-4 }
  .container_class { relative flex items-end justify-start min-h-[100lvh] overflow-visible bg-brand-structural pt-20 md:pt-24 short:pt-16 }
  .title_class { text-3xl font-bold leading-tight tracking-brand text-brand-bg lg:text-4xl xl:text-6xl short:text-3xl short:xl:text-4xl mb-component max-w-2xl }
  .pretitle_class { inline-block px-3 py-1 mb-component text-sm font-bold tracking-brand text-brand-accent/80 uppercase bg-black/40 rounded-full border border-white/20 backdrop-blur-sm }
  .description_class { py-component text-lg leading-brand tracking-brand text-white max-w-xl p-component rounded-2xl border border-white/10 short:py-2 short:text-base }
