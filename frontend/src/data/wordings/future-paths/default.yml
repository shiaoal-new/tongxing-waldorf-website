seo:
  title: 未來出路：具備自轉能力的自由人 | 同心華德福
  description: 同心華德福畢業生具備強大的自轉學習能力與心理素質，能靈活適應體制內外的高教體系、海外升學以及多元的職業挑戰。

hero:
  title: 未來出路
  subtitle: 帶著獨立思考與意志，走向屬於自己的自由之路
  accent_text: Future Paths & Alumni

waldorf:
  title: 銜接華德福高中教育
  subtitle: 深耕華德福體系的完整學習
  content: 許多學生選擇直升或轉入華德福高中，如同心與青禾共同孕育的「昱光華德福實驗教育機構」。曾有學生在轉回體制後感到學習「一片空白」，最終回歸華德福找回內在的充實感。
  item_yuguang:
    title: 昱光華德福
    content: 提供畢業生直升管道，銜接九到十二年級的完整課程，讓孩子在台北繼續接受在地化的華德福教育。
  item_experiment:
    title: 多元實驗教育
    content: 畢業生亦可選擇銜接全台各地的實驗機構，繼續探索生命的熱情並尋找自我的生命任務。

adaptation:
  title: 回歸體制的適應力
  subtitle: 銜接、翻譯與後發先至
  content: 華德福孩子具備強大的「自轉」能力。雖然初期不熟悉考試技巧與語文邏輯，但通常能在半年到一年左右掌握遊戲規則。
  item_translation:
    title: 學習「考試的語言」
    content: 面對如會考等大型測驗時，一旦掌握了題目背後的翻譯邏輯，分數通常會展現「三級跳」的爆發力。
  item_motivation:
    title: 保有強大學習胃口
    content: 孩子對世界保有好奇心，不會因壓力而厭學。當發現差距時，會展現出自發性的意志力主動追趕。

academic:
  title: 國內外大學深造
  subtitle: 展現優異的理解力與原創思考
  content: 畢業生在台大物理研究所、清大外文系、交大、成大、北藝大及北醫等名校皆有出色表現。學生能運用「個人專題」在特殊選才中脫贏而出。
  item_domestic:
    title: 國內頂尖學府
    content: 出路涵蓋資工、理科、語文、醫藥及藝術等多元領域，畢業生的自信與思辨能力常讓面試官印象深刻。
  item_special:
    title: 特殊選才優勢
    content: 「個人專題」培養的獨立研究能力，讓孩子在多元入學與特殊選才制度中極具競爭力。

mindset:
  title: 心理素質與應對壓力
  subtitle: 挫折容忍度與自我定錨
  content: 華德福孩子展現出更強的「創造新工作」能力。從職業運動員到 YouTube 創作者，他們具備在高壓環境中「自轉」與定錨的韌性。
  item_resilience:
    title: 強韌的抗壓性
    content: 透過山林跨越與大縱走等長期鍛鍊，孩子學會「跌倒後自己站起來」，具備高度的挫折容忍度。
  item_future:
    title: 創造力與新職業
    content: 畢業生在尚未被定義的新興行業中展現創意，他們能獨立解決問題並在高變動時代中找到立足點。

support:
  title: 給家長的支持建議
  subtitle: 成為孩子穩定情感的定錨點
  content: 當孩子面對競爭壓力時，家長最好的支持是處理自身的焦慮、維持穩定的節奏。家長穩，孩子就穩。
  item_awareness:
    title: 覺察焦慮與自我定錨
    content: 覺察焦慮是否源於過去系統的制約。練習放下過度期待，由掌控轉向陪伴，「家長穩，孩子就穩」。
  item_redefine:
    title: 重新定義學習與成功
    content: 信任孩子的「自轉」能量與學習胃口。看見長遠的生命素質（如創造力），避免過早硬化導致的思維僵化。
  item_role:
    title: 調整陪伴的角色
    content: 進入青少年階段，家長應給予更大的隱私與選擇權。優先保障充足睡眠，「補眠」勝過補習，創造呼氣時光。
  item_reality:
    title: 理解銜接的現實面
    content: 平常心看待銜接磨合期，掌握應試邏輯後分數會爆發性成長。善用「個人專題」於多元入學優勢。

summary:
  title: 培養獨立思考的自由人
  content: 總結來說，同心畢業生的優勢在於強大的意志力與自我認同。家長最好的支持是「放手讓孩子去飛」，讓他們在錯誤與跌倒中學會站起來，長出屬於自己的翅膀。
  button: 回到首頁
