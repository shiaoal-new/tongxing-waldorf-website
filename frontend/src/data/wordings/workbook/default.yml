seo:
  title: 工作本：孩子專屬的教科書 | 同心華德福
  description: 在同心華德福，「工作本」（Main Lesson Book）是孩子學習歷程中最核心的紀錄工具。它不僅僅是一本筆記本，更是孩子親手為自己製作、獨一無二的專屬教科書。

hero:
  title: 工作本
  subtitle: 孩子親手縫綴的生命教科書
  accent_text: Main Lesson Book

concept:
  title: 取代傳統教科書
  subtitle: 自我生成的知識紀錄
  content: 同心不使用現成的統一教科書。老師根據課綱結合在地素材，將教學內容繪製於黑板。學生則在空白的工作本上，透過理解進行記錄、轉化與繪製。

path:
  title: 內化後的綻放
  subtitle: 內容進入內心，再從雙手出來
  content: 製作過程體現了內容的一步步內化。這不是機械式的抄寫，而是經過心魂消化後的個人化表達，孩子在看見成果時，臉上往往散發著成就感的光芒。
  item_internalization:
    title: 非機械式抄寫
    content: 不同於傳統教育的單向灌輸，工作本要求孩子將學到的東西經過心魂的消化，再以文字與繪圖呈現。
  item_connection:
    title: 情感與意志的連結
    content: 孩子在製作時通常充滿熱情，甚至會因為看見自己努力的成果而「臉上發光」。
  item_expression:
    title: 個人化的表達
    content: 每個孩子的工作本都有其獨特風格，反映出他們不同的特質與發展狀態。

assessment:
  title: 作為質性評量的工具
  subtitle: 看見孩子真實的發展脈絡
  content: 老師不以分數評斷孩子，而是透過工作本了解孩子在思維、情感與意志各個面向上真實的進展。我們優先肯定努力，保護孩子對學習的熱情與胃口。
  item_observation:
    title: 細緻觀察
    content: 老師透過工作本了解孩子在思維、情感與意志各個面向上真實的發展脈絡。
  item_protection:
    title: 保護學習胃口
    content: 為了維護孩子的成就感，老師在批改時不會一味地挑錯別字。有時會刻意忽略細微錯誤，優先肯定孩子的努力與內容。

grades:
  title: 跨學科的整合應用
  subtitle: 紀錄不同階段的成長亮點
  low:
    title: 低年段 (G1-G2)
    content: 著重於線畫、像形文字與圖像式的記錄，開啟對文字與形狀的感知。
  mid:
    title: 中年段 (G3-G4)
    content: 結合農耕、建築與地方探究，繪製鳥瞰圖或記錄植物生長現象，探索世界的具體聯繫。
  high:
    title: 高年段與中學
    content: 記錄更複雜的科學觀察（如聲光熱、力學）與歷史、地理的深層思辨，進入抽象思考的領域。

summary:
  title: 生命經驗的縮影
  content: 總結來說，工作本是孩子生命經驗的縮影。它是孩子用意志力、美感與思考共同織就的成果。當孩子回到家中翻看工作本時，他看見的是與自己生命緊密相連的知覺。
  button: 回到首頁
