title: 優律思美 (這不是神秘組織喔)
hero:
  title: 優律思美 (Eurythmy)
  subtitle: 讓聲音「顯靈」的藝術：用身體畫出靈魂的曲線 ✨
  content: |
    很多人第一次看優律思美，心裡會 OS：**「這是在練氣功？還是慢動作芭蕾？」** 💃

    其實，我們是在做一件很酷的事：把「聽不見」的聲音變成「看得見」的動作。在同心，這不是才藝班，而是陪孩子從「我是誰？我在哪？」進化到「我有意識我自由」的神奇路徑。

origin:
  title: 起源：因為「愛問」才出世的藝術 🙋‍♀️
  content: |
    這門藝術誕生於 **1912 年**。當時有個熱愛跳舞的女兒，她媽媽跑去問魯道夫·史代納（華德福的那個爺爺）：「有沒有適合我女兒練、又有人智學精神的舞啊？」

    史代納爺爺笑著說：**「妳問得正好！」** 這就是靈性法則：你不問，他不說；你一開口，宇宙的能量就流過來了。優律思美就是要把那個創造世界的「道」（Logos），透過你的手腳「顯現」出來。

core:
  title: 核心原理：3D 版的語言與音樂 📢
  content: |
    優律思美把喉嚨裡的氣流能量，直接投影到全身。想像你的身體就是一台超大型 3D 投影機，正把宇宙的創造法則「播」給大家看。

speech:
  title: 看得見的語言 (會動的語法) 👄
  content: |
    在這裡，聲音是有形狀的。四年級以後，孩子連動個詞都要分「主動」還是「被動」。向前走是主動，後退是被動，中文課本要是能這樣教，我當年就不會打瞌睡了。
  vowels:
    title: 母音 (心 soul 的感受)
    content: 如 A、E、I、O、U。這是靈魂在發言（像是「哇！」、「喔～」）。就是在練習怎麼把內心的情緒「噴」出來。
  consonants:
    title: 子音 (外在世界的模仿)
    content: 如 B、M、K。這是對世界的回應。像是「K」就是一個硬邦邦的阻擋，「M」則是溫柔的抱抱。

music:
  title: 看得見的音樂 (音符的走位) 🎶
  content: |
    把音符、節奏、大調（我最棒）、小調（我好悶）通通變成腳步。
  intervals:
    title: 間隙 (空氣中的留白)
    content: 我們特別在意「音與音之間」。不是只有聲音重要，那個「空隙」才是最有靈氣的地方。

education:
  title: 教育應用：不是在轉圈圈，是在螺旋長大 🌀

grade1_3:
  title: 低年級：我與世界是好麻吉 (G1-G3)
  content: 這時候的孩子是「模仿界」的大師。我們透過想像力，讓他們跟著世界的節律一起呼吸，身體裡住著一整個宇宙。
  g1:
    title: 一年級 (G1)
    content: 練習走直線與曲線。聽起來簡單？這可是跟大地接軌的第一步，別跌倒啊！
  g2:
    title: 二年級 (G2)
    content: 鏡像練習。開始發現你、我、他。
  g3:
    title: 三年級 (九歲危機 😱)
    content: 孩子開始發現「我跟世界不一樣」。課程會帶他們在圓圈中找中心，既能跟團體混在一起，又不會弄丟自己。

grade4_6:
  title: 中年級：鍛鍊意志的「羅馬軍團」 (G4-G6)
  content: 進入規則期。這時候不是想怎麼動就怎麼動，要講究精準和幾何感，像是在用身體畫數學題。
  g4:
    title: 四年級 (G4)
    content: 從看圓心變成看前方。這代表孩子開始有「前後左右」的空間意識了，不再是那個整天繞圈圈的小小孩。
  g5:
    title: 五年級 (黃金時代 ✨)
    content: 希臘般的優雅。這是孩子身心靈最平衡的巔峰，動起來漂亮得像幅畫。
  g6:
    title: 六年級 (規矩與律法 🛡️)
    content: 進入羅馬時期。不能隨便亂撞人，要守規矩。這是在練意志力，也是在學怎麼在群體中不當「雷隊友」。

grade7_12:
  title: 高年級：靈魂的高潮迭起 (G7-G12)
  content: 青春期來了，情緒很多？那就透過優律思美把它們「甩」出來。這不是亂甩，是靈魂的歌唱。
  g7:
    title: 七年級 (G7)
    content: 探索「之間」的關係。這年紀的孩子最難搞，也最需要感受「連結」。
  g11:
    title: 高中部 (G11)
    content: 用貝多芬來表達憤怒與狂喜。這比去 KTV 唱歌還療癒，幫助宅男宅女們轉化那些說不出口的內在風暴。

adult:
  title: 成人版：修補你那卡住的「凡人之軀」 🛠️
  content: 成人優律思美不是要讓你變舞星，是要幫你把壞掉（太累、太乾、太僵硬）的身體調回來。
  tuning:
    title: 調音 (把緊繃鬆開 🔧)
    content: 大人的身體常像沒上油的機器。課程第一步就是「鬆開」，找回那個被工作搞丟的彈性。
  connection:
    title: 重新連線
    content: 找回「我」跟這個物質世界的連線，不要整天活在腦袋或手機裡。
  healing:
    title: 強大的療癒力
    content: 史代納說這能「對抗虛偽」。當你誠實地面對身體的律動，那些用腦過度的焦慮就會慢慢流走。
