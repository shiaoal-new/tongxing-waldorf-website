title: 華德福文史教育 (Humanities)
hero:
  title: 華德福文史教育
  subtitle: 人類意識演進的探索之旅

intro:
  title: 文史不只是科目，而是意識的演化
  content: |
    在華德福教育中，「文史」不只是兩個科目的結合，而是一場 **「人類意識演進的探索之旅」** 。同心華德福將語文（Language Arts）與歷史（History）編織在一起，這與體制內教育有著本質上的差異。
    我們不追求線性的記憶，而是尋求 **意識的共鳴** 。

comparison:
  title: 核心邏輯的差異

comparison_block:
  left:
    label: 體制內教育
    badge: 知識傳遞型
    items:
      - text: 教學目標
        description: 記住年份、人物、因果，應付考試。
      - text: 教材來源
        description: 濃縮的教科書、編年史。
      - text: 學習方式
        description: 聽講、背誦、寫練習卷。
      - text: 語文角色
        description: 作為溝通與答題的工具。
  right:
    label: 同心華德福
    badge: 意識演化型
    items:
      - text: 教學目標
        description: 讓孩子在不同年紀，與人類文明的特定階段 **共鳴** 。
      - text: 教材來源
        description: "**原典、神話、傳記、詩歌** ，以及孩子親手畫的「工作本」。"
      - text: 學習方式
        description: "**講述、戲劇表演、藝術創作、感官體驗** 。"
      - text: 語文角色
        description: 作為 **表達靈魂與理解歷史** 的媒介。

path:
  title: 文史是如何「活」起來的？(教學路徑)
  stage1:
    title: 低年級：語感與圖象的播種 (1-3 年級)
    content: |
      老師每天講述童話、寓言與聖者故事。孩子不只是聽，還會透過 **戲劇演出** （演故事裡的小兔子或聖者）來內化語言。
      孩子把聽到的故事場景畫下來，再從中提煉出文字。這時歷史是「意象」，語文是「情感」。
  stage2:
    title: 中年級：從神話邁向人性 (4-6 年級)
    content: |
      當孩子開始有自我意識（九歲轉折），課程進入 **北歐神話、古埃及、古希臘** 。這些神祇的掙扎與英雄的冒險，正對應孩子內心的混亂與勇氣。
      孩子開始撰寫長篇的 **敘述性文章** 。他們模擬希臘戰士寫信，或用優美的辭藻描述金字塔的建造。
  stage3:
    title: 高年級：理性、辯證與觀點 (7-9 年級)
    content: |
      進入 **文藝復興、大航海時代、工業革命** 。重點不再是背誦年代，而是討論「人的力量如何改變世界」。
      練習 **論說文與評論** 。孩子學習如何針對歷史事件提出自己的觀點，這時語文變成了「思考的利劍」。

qa:
  title: 解決家長的疑慮
  pain_point:
    title: 痛點解決：拒絕「死背硬記」
    content: 體制內歷史常讓孩子覺得「這與我無關」。同心透過故事與藝術，讓歷史人物變成孩子的朋友。解決了家長擔心孩子「討厭讀書、覺得學問枯燥」的煩惱。
  itch_point:
    title: 癢點滿足：深厚的人文底蘊
    content: 家長渴望孩子不僅有競爭力，更有「氣質」與「見識」。在同心，孩子讀的是荷馬史詩、莎士比亞。這種 **大量的經典閱讀與高品質的口說語文** ，搔到了家長對精英人文教育的嚮往。
  highlight:
    title: 亮點展現：產出「自己的課本」
    content: |
      每一位同心孩子的 **「主修課工作本 (Main Lesson Book)」** 都是亮點。
      沒有標準答案的評量，只有孩子親筆書寫的優美字跡與親手繪製的歷史插畫。這份「作品」是孩子一輩子的寶藏。
