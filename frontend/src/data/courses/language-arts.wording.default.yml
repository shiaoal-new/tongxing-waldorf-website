title: 華德福語文教育 (Language Arts)
hero:
  title: 華德福語文教育
  subtitle: 讓文字從孩子的雙手與心靈中長出來

intro:
  title: 全人體驗的語文學習
  content: |
    在華德福教育中，語文學習被視為一種 **「全人體驗」**，而不僅僅是符號的認知。同心華德福的教法與體制內最大的不同在於： **體制內是「從大腦抽象認知開始」** ，而 **華德福則是「從身體感官與藝術體驗開始」** 。

comparison:
  title: 學習路徑的根本差異
  point1:
    title: 啟動點
    content: |
      **華德福教育**：先聽故事、畫畫、律動，最後才識字。

      **體制內教育**：先認字、拼音、寫字，再理解意義。
  point2:
    title: 書寫順序
    content: |
      **華德福教育**：從「形狀」開始，由畫畫過渡到寫字，強調美感。

      **體制內教育**：為了考試或溝通，大量重複臨摹字體。
  point3:
    title: 教材來源
    content: |
      **華德福教育**： **工作本 (Main Lesson Book)** ：學生親手繪製自己的課本。

      **體制內教育**：統一編製的教科書、測驗卷。
  point4:
    title: 驅動力
    content: |
      **華德福教育**：內在情感連結、對故事的好奇心。

      **體制內教育**：外部評比、分數與進度壓力。

path:
  title: 華德福語文學習的三部曲
  stage1:
    title: 第一階段：大量「聽」與「說」的浸潤 (低年級)
    content: |
      在正式動筆寫字前，老師會講述大量的神話、童話與寓言。
      * **晨圈 (Morning Circle)：** 透過詩歌朗誦、手指謠、配合韻律的肢體動作，讓文字的「音韻」進入身體。
      * **故事引導：** 文字不是冰冷的工具，而是有生命的。
  stage2:
    title: 第二階段：從「畫」到「寫」 (形線畫)
    content: |
      華德福認為，文字源於圖像（如象形文字）。
      * **形線畫 (Form Drawing)：** 孩子先練習畫曲線、直線、螺旋，訓練手眼協調與意志。
      * **字母的誕生：** 老師會講一個故事，例如「山 (Mountain)」的形狀慢慢演變成字母 「M」。
      * **工作本：** 孩子親手繪製課本，每一頁都是藝術品。
  stage3:
    title: 第三階段：從「感性」到「理性」的分析 (高年級)
    content: |
      當孩子建立強大的語感後，才開始引入文法、修辭與邏輯分析。
      這時學習文法不再是枯燥的公式，而是為了更精準地表達內心的世界。

qa:
  title: 解決家長的疑慮
  pain_point:
    title: 痛點解決
    content: 解決了孩子對語文產生的「厭學感」。在同心，孩子是為了想記錄故事而寫字，主動性極強。
  itch_point:
    title: 癢點滿足
    content: 培養了深厚的 **文學底蘊與審美** 。詞彙是從高品質的口述文學中自然吸收的。
  highlight:
    title: 亮點展現
    content: 擁有 **「帶得走的創造力」** 。學到的不貞是語文，更是系統化整理知識與美化表達的能力。
