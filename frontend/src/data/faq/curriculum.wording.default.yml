faq:
  curriculum:
    title: 教學內容與課程規劃
    content: |
      同心華德福致力於提供符合孩子身心發展的深耕教育。

      **主課程 (Main Lesson)**
      每天上午安排連續兩小時的主課程，讓學員能在精神最集中的時段，針對特定學科進行深度的專題探究與沈浸式學習。

      **藝術與實手操作 (Artistic & Handwork)**
      課程中融入豐富的藝術元素，如音樂、濕水彩、木工與手工。透過意志、情感與思考的平衡發展，落實全人教育目標。

      **優律思美 (Eurythmy)**
      這是一門獨特的運動藝術，協助孩子發展空間感與內在節奏，並學習與群體和諧互動。

      **九年一貫學制**
      我們提供 1-9 年級的連貫學制，能大幅降低升學過渡期的適應壓力，讓師資與同儕關係維持長期的穩定支持。
