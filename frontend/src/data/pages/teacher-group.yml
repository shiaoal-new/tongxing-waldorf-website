    blocks:
      - type: text_block
        title: $intro.blocks.0.title
        content: $intro.blocks.0.content

  - section_id: full-time
    layout: "突出標題風格"
    blocks:
      - type: text_block
        title: $full-time.blocks.0.title
        subtitle: $full-time.blocks.0.subtitle
      - type: member_block
        members:
          - "詹雅智"
          - "連涓妏"
          - "呂孟庭"
          - "姚昱廷"
          - "趙奕瑋"
          - "黃郁容"
          - "周天禧"
          - "游鈞桓"
          - "姜怡伶"
          - "黃千瑜"
          - "高縈婕"
          - "高嘉淇"

  - section_id: administrative
