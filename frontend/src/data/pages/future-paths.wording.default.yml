seo:
  title: 學生未來出路
  description: 華德福教育在國中畢業後出路多元，涵蓋華德福高中、主流名校、自學及特殊選才。透過真實案例，深入了解華德福畢業生如何憑藉強大的自學力與自信，在各領域展現卓越表現。
  keywords: 華德福畢業生出路, 華德福銜接體制, 特殊選才, 實驗教育升學, 同心華德福案例

hero:
  title: 未來出路
  subtitle: 帶著獨立思考與意志，走向屬於自己的自由之路
  accent_text: Future Paths & Alumni

# 繼續就讀華德福高中
waldorf:
  title: 繼續就讀華德福高中
  subtitle: 深耕體系的完整十二年一貫教育
  content: 選擇續留華德福體系的學生，能在青少年心理轉折的關鍵期，獲得最完整的人文支援、科學探索與藝術薰陶，長出深厚的內在定力。

  item_yuguang:
    title: 銜接昱光華德福
    content: 同心畢業生可優選銜接「昱光華德福實驗教育機構」，透過九到十二年級的在地化課程，培養具備國際視野與土地認同的青年。

  item_shi:
    title: 案例：石恩亞 (Shi En-ya)
    content: 從幼兒園念到高中畢業，現為運動媒體專欄作家與 YouTube 創作者。他透過「特殊選才」進入交大百川學級學程，他認為華德福讓他保有自信去尋找並自學熱愛的事物，而非被動接受選擇。

  item_li:
    title: 案例：李庭怡 (Li Ting-yi)
    content: 慈心第一屆國中畢業生，後就讀東海大學中文系。畢業後選擇回歸華德福教育現場，將所學的回饋給學弟妹，展現教育使命感。

# 轉入主流高中
adaptation:
  title: 轉入主流高中或國外升學
  subtitle: 內在驅動力帶動的跨體制適應力
  content: 華德福孩子在國中階段培養的「洞察力」與「抗壓性」，能協助他們在轉入主流體制時，展現出自發性的進步爆發力。

  item_transfer:
    title: 回歸主流體制與會考
    content: 許多家長在孩子體驗九年全人發展後，選擇銜接會考或直升主流高中。雖然起初需適應考試技巧，但由於學習胃口未受損，通常能快速追平甚至超越。

  item_academic_case:
    title: 案例：武陵高中與 5A10+
    content: 曾有畢業生在國中轉體制後，會考取得 5A10+ 佳績錄取武陵高中。家長認為華德福培養的自主學習力極強，當孩子明白「為何而戰」時，進步速度驚人。

  item_hk_case:
    title: 案例：從後段到年級第一
    content: 有學生轉入具強度的主流學校，起初入學考倒數，但在一年內憑藉高自學能力（無補習）衝到年級前十，最終以第一名畢業。這證實了華德福孩子的心理能量。

roadmap:
  title: 華德福國中畢業後的成長地圖
  subtitle: 多元並行的教育路徑，通往共同的自由目標
  chart: |
    mindmap
      root((華德福國中畢業))
        繼續華德福高中
          昱光/慈心高中
          → 特殊選才/學測
          → 大學/藝術/媒體
