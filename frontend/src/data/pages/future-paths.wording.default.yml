intro:
  seo:
    title: 國中畢業後出路分析
    description: 台灣華德福教育發展蓬勃，但當孩子來到 9 年級畢業前夕，家庭面臨著巨大的抉擇。本分析報告整合現況數據與家長經驗，為您解析不同路徑的風險與機會。
    keywords: 華德福畢業生出路, 華德福銜接體制, 特殊選才, 實驗教育升學, 同心華德福案例, 畢業流向, 轉軌成功因素
  hero:
    title: 國中畢業後出路分析
    subtitle: 15 歲的十字路口：選擇體制內、續讀華德福，還是走向世界？
    accent_text: Future Paths & Alumni

overview:
  title: 現況景觀與流向
  distribution:
    title: 畢業生流向分佈
    content: 根據近年台灣各地華德福實驗教育機構的觀察，畢業生並非全部選擇直升高中部。約有四成學生會選擇挑戰「體制內」高中或技職體系。
    chart_title: 華德福 9 年級畢業生流向比例
    data:
      - name: "續讀華德福高中"
        value: 45
      - name: "轉考公私立普高"
        value: 30
      - name: "技職體系(高職/五專)"
        value: 15
      - name: "出國留學"
        value: 5
      - name: "自學/其他機構"
        value: 5

analysis:
  comparison:
    title: 三大路徑：多維度比較分析
    subtitle: 選擇沒有絕對的好壞，只有適不適合
    chart_title: 路徑特性分布對比 (0-100)
    content: 我們從學業壓力、創意思考空間、社交多樣性等五個維度，比較「續讀華德福」、「公立普通高中」與「技職體系」的差異。
    radar:
      labels:
        [
          "學業考試壓力",
          "創意與自由度",
          "學費支出",
          "社交圈多樣性",
          "自主管理要求",
        ]
      datasets:
        - label: "續讀華德福"
          data: [20, 95, 80, 40, 90]
        - label: "公立普高"
          data: [95, 30, 20, 90, 60]
        - label: "技職體系"
          data: [60, 70, 30, 80, 70]
    waldorf:
      title: 續讀華德福 (Waldorf HS)
      content: 優勢在於心靈健康與創造力發展，社交圈較封閉但緊密。適合清楚自己志向、不適應填鴨式教育的孩子。家長需考慮較高昂的學費與未來的特殊升學管道（特殊選才）。
    mainstream:
      title: 普通高中 (Mainstream HS)
      content: 學業壓力極大，重視標準答案與考試技巧。社交圈廣闊但競爭激烈。適合學術傾向強、抗壓性高、希望能經由分科測驗進入傳統頂尖大學的學生。
    vocational:
      title: 技職體系 (Vocational)
      content: 強調「做中學」，與華德福教育理念有部分重疊（實作精神）。適合對特定領域（如設計、餐飲、農工）有明確興趣的孩子。
  success_factors:
    title: 轉軌成功 vs. 掙扎的關鍵因素
    content: 許多家長擔心孩子無法適應體制內的考試機器。數據顯示，華德福孩子在「自主學習」與「社團表現」上往往優於體制內學生，但在「標準化測驗」與「時間管理」初期會面臨巨大挑戰。
    chart_title: "核心能力對比評分 (0-100)"
    bar:
      labels:
        [
          "自主專題研究能力",
          "標準化考試技巧",
          "口語表達與簡報",
          "長時間專注記憶",
          "跨領域整合思考",
          "同儕競爭適應力",
        ]
      datasets:
        - label: "華德福學生優勢"
          data: [90, 20, 85, 40, 85, 50]
        - label: "體制內學生優勢"
          data: [50, 95, 60, 90, 50, 90]
    insight: "> **關鍵洞察**：成功轉軌的案例中，通常不是因為孩子原本就很會考試，而是因為他們擁有強大的「心理韌性」與「解決問題的能力」。"
  advice:
    title: 過來人的真實建議
    parent:
      title: 轉軌成功的家長
      content: '"剛進公立高中時，孩子對排名很感冒，成績一度墊底。但我們鼓勵他發揮華德福的『圖文整合能力』做筆記，後來他在探究實作課程大放異彩，找回了自信。"'
      badge: "適合：抗壓性高、對學科有興趣的孩子"
    student:
      title: 回流華德福的學生
      content: '"我去了一學期的私立高中，每天考試到晚上九點。我覺得自己像個填鴨機器，失去了對世界的好奇心。回到華德福高中部後，雖然資源較少，但我知道我在『活著』。"'
      badge: "適合：極需意義感、對藝術/實作敏感的孩子"
    vocational:
      title: 選擇技職(高職)的路
      content: '"華德福從小就在做木工、織布，所以我選手作性質強的科系非常適應。雖然學科有些吃力，但在實習課我幾乎是全班最快上手的。"'
      badge: "適合：動手能力強、學科興趣缺缺的孩子"

# 第三章：路徑深入探索 (現在使用 Switcher)
paths:
  title: 深度路徑探索
  subtitle: 請選擇您感興趣的路徑，了解更多細節、建議與時程

  waldorf:
    label: 續讀華德福
    desc: 深耕體系的完整教育
    title: 續讀華德福高中
    subtitle: 深耕體系的完整十二年一貫教育
    content: 選擇續留華德福體系的學生，能在青少年心理轉折的關鍵期，獲得完整的人文支援。課程涵蓋從黑格爾哲學、投影幾何到近代史分析等深度主題，並輔以高強度的戲劇排演與手工作業。
    item_yuguang:
      title: 銜接昱光華德福
      content: 同心畢業生可優先銜接「昱光華德福實驗教育機構」，延續主修課與導師制度。
    item_curriculum:
      title: 高中主修課題表
      content: 包含測量、有機化學、建築、世界文學等跨學科主題，培養宏觀的思維地圖。
    case_shi:
      title: 案例：石恩亞 (Shi En-ya)
      content: 華德福 16 年畢業生，透過「特殊選才」錄取陽明交大。現為運動媒體專欄作家與自媒體人，他認為華德福教育賦予他極強的「自學力」與追求熱情的自信。
    advice:
      title: 回流生的心聲
      content: "回到華德福高中部後，我知道我在『活著』。"

  mainstream:
    label: 轉軌主流高中
    desc: 挑戰自我與跨體制適應
    title: 轉軌主流高中：跨體制的生命挑戰
    subtitle: 內在驅動力帶動的跨體制適應力
    content: 華德福孩子在國中階段培養的「洞察力」與「抗壓性」，能協助他們快速適應體制內環境。

    # 1. 轉回體制內更細的路徑及比較
    path_comparison:
      title: 體制內路徑細分與比較
      items:
        - title: 公立普通高中 (Senior High)
          content: 學費低廉，學術競爭激烈。適合學術傾向強、抗壓性高、目標為傳統頂尖大學的學生。入學主要管道為「國中教育會考」。
        - title: 私立普高/各類實驗班
          content: 管理較嚴格，常設有醫科班或資優班。適合需要結構化管理、或希望在特定學科加速的孩子。入學管道包括會考、直升或入學測試。
        - title: 技術高中 (Vocational)
          content: 強調「做中學」，實務技能導向。適合動手能力強、已明確職業興趣（如設計、餐飲）的孩子。入學管道為會考或技優甄審。

    # 2. 成功、失敗案例分析
    case_analysis:
      title: 成功與失敗案例析賞
      success:
        title: 成功案例：從適應衝擊到卓越表現
        content: 一位畢業生進入武陵高中後，初期面臨分數墊底的衝擊，但在高二憑藉華德福培養的「自主學習習慣」與「圖文整合力」，快速補齊數理落差，最終以優異成績錄取頂尖大學。
      failure:
        title: 失敗風險：教育斷層與認同衝突
        content: 當家長強制將未經溝通過的孩子送入高壓私校，常引發嚴重的心理崩潰與「厭學」情緒。失敗關鍵在於缺乏「心理緩衝」與對體制規則的劇烈排斥。

    # 3. 轉軌成敗的關鍵因素
    success_factors_summary:
      title: 影響轉軌成敗的關鍵因素
      content: 成功轉軌並非取決於「原本就很會考試」，而在於強大的「心理韌性」與家長作為「緩衝墊」的支持角色。

    # 4. 準備時程表 (保持之前更新過的豐富內容)
    timeline_title: 轉軌準備時程表 (準備降落傘)
    timeline:
      items:
        - type: header
          title: 第一階段：探索與決策
          color: "#6A1B9A"
        - year: "8 年級下學期"
          title: 探索與初步決策
          content: 繪製「生命地圖」，家長與孩子深度對話。若傾向轉軌，需開始接觸補充教材，熟悉體制內的「溝通語言」。
        - year: "9 年級上學期"
          title: 心理調適與專題平衡
          content: 在「畢業專題」深度投入與「學科總複習」間取得平衡。家長需陪伴處理「慢學」與「競爭」的內在衝突。
        - type: header
          title: 第二階段：衝刺與銜接
          color: "#E65100"
        - year: "9 年級下學期"
          title: 意志爆發與身心跨越
          content: 5月教育會考，6月畢業公演。成功關鍵在於將解決問題的能力轉化為穩定的「量化學習效能」。
        - year: "10 年級"
          title: 跨文化適應與信心重建
          content: 進入新環境的前 6 個月是關鍵。利用華德福特有的「圖文整合力」做筆記，在社團活動中重建認同。

    # 5. 給轉軌家庭的調適建議
    parent_guide:
      title: 給轉軌家庭的調適建議
      items:
        - title: 心理緩衝：建立「非同步」預期
          content: 初步進入體制時，建議前 6 個月降低對分數的期待，優先關注社交融入與心理韌性。
        - title: 角色切換：成為孩子的「支持盾」
          content: 認可華德福背景帶來的「多元視角」，而非將其視為弱點，協助孩子緩衝量化評價的壓力。
        - title: 學業支持：意義感轉化效用
          content: 尋找能解釋學科「為什麼」的資源（如原理導向的輔導），避免純粹的題海灌輸。
        - title: 自我照護：管理家長焦慮
          content: 華德福培養的是「長線競爭力」，當前微小的分數起伏不代表整體發展的失敗。

    # 6. 家長轉銜心得分享
    advice:
      title: 家長轉銜心得分享
      content: "不要將孩子視為待修補的產品。我們鼓勵他發揮圖文整合能力做筆記，後來他在探究實作課程大放異彩，找回了自信。"

  diverse:
    label: 自學與技職
    desc: 探索非傳統發展路徑
    title: 自學與多元職涯
    subtitle: 探索非傳統路徑的生命色彩
    content: 畢業生出路廣及自媒體與跨國讀書。華德福強調的靈活性，幫助他們發掘「新興職業」。
    item_special:
      title: 特殊選才與升學優勢
      content: 華德福高中的「畢業專題」是申請特殊選才的核心資產。許多畢業生憑藉深厚的自我覺察與對議題的論述能力，錄取清大、交大、北藝大等頂尖學府。
    item_global:
      title: 國際流動與海外銜接
      content: 台灣華德福學生具備良好的國際流動性。部分家庭選擇在 9 年級後將孩子送往德國、澳洲或美國的華德福高中，無縫接軌當地的藝術與學術課程。
    advice:
      title: 技職生的實作力
      content: "華德福孩子具備卓越的『動手做』精神。在注重實習的技術中學裡，這份對材料的敏感度與自律性常讓他們在專業科目上脫穎而出。"

footer:
  summary:
    title: 培養具備自轉能力的自由人
    content: 每一個靈魂都有適合他的土壤。本分析僅供參考，實際選擇請依據孩子的個別氣質與家庭狀況評估。
    button: 了解更多入學資訊
