# 自學、實驗教育與多元出路
pathway:
  title: 自學、實驗教育與多元出路
  subtitle: 探索非傳統路徑的生命色彩
  content: 不受限於學科成績，華德福畢業生常在藝術、運動、媒體或創業領域展現專題研究與獨立解決問題的天賦。

  item_special:
    title: 特殊選才與大學升學
    content: 「個人專題」是華德福國高中的核心。透過特殊選才，許多學生成功錄取清大、交大、北藝大等頂尖學府。如林芳如同學透過高中自學與特殊選才錄取清大，展現了明確的志向。

  item_stats:
    title: 國際研究數據
    content: 德國研究顯示，華德福畢業生大學入學測驗（Abitur）合格率是公立學校的 2-3 倍，且在 SAT 成績、人文與科學表現常優於平均，其自信心與社交能力亦更突出。

  item_diverse:
    title: 多元職涯發展
    content: 畢業生出路廣及運動、藝術、自媒體與跨國讀書（如美、加、德）。華德福強調的靈活性，幫助他們在高變動時代中發掘「新興職業」並創造價值。

# 給家長的支持建議
support:
  title: 家長觀點與支持建議
  subtitle: 成為孩子穩定情感的定錨點
  content: 華德福強調「每個生命都能開出燦爛的花朵」，家長最重要的是陪伴、給嘗試機會，而不是過度追求標準升學路徑。

  advice_transition:
    title: 不要過度擔心銜接
    content: 華德福培養的洞察力、自主學習與專題報告能力（國中即有長篇專題），在主流體制的大學與職場競爭力极佳。轉型期只需適度練習答題技巧即可。

  advice_rhythm:
    title: 信任孩子的生命節奏
    content: 父母不催促「正常路徑」，而是陪伴傾聽（即使孩子休學或焦慮）。「騎車載孩子出去走走」有時比補習更強大。重點在讓孩子找到熱情，而非僅是學科成績。

  advice_coop:
    title: 家庭與現實的權衡
    content: 若家庭經濟情況普通，國中後轉體制是具保障的選擇；若追求長期的自信與熱情，慢學的後勁更有競爭力。家長應覺察自身焦慮，避免將系統制慮投射給孩子。

  item_awareness:
    title: 覺察焦慮與自我定錨
    content: 覺察焦慮是否源於過去系統的制約。練習健康地放下過度期待，由掌控轉向陪伴，「家長穩，孩子就穩」。

summary:
  title: 培養具備自轉能力的自由人
  content: 同心畢業生並非「無法適應主流」，反而常因內心動力強、能獨立思考而在不同體系裡脫穎而出。孩子內心比大人想像強大，家長只需做好陪伴，信任每個生命的獨特綻放！
