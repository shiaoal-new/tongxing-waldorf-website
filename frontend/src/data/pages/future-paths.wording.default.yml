intro:
  seo:
    title: 國中畢業後出路分析
    description: 台灣華德福教育發展蓬勃，但當孩子來到 9 年級畢業前夕，家庭面臨著巨大的抉擇。本分析報告整合現況數據與家長經驗，為您解析不同路徑的風險與機會。
    keywords: 華德福畢業生出路, 華德福銜接體制, 特殊選才, 實驗教育升學, 同心華德福案例, 畢業流向, 轉軌成功因素
  hero:
    title: 國中畢業後出路分析
    subtitle: 15 歲的十字路口：選擇體制內、續讀華德福，還是走向世界？
    accent_text: Future Paths & Alumni

overview:
  title: 現況景觀與流向
  distribution:
    title: 畢業生流向分佈
    content: 根據近年台灣各地華德福實驗教育機構的觀察，畢業生並非全部選擇直升高中部。約有四成學生會選擇挑戰「體制內」高中或技職體系。
    chart_title: 華德福 9 年級畢業生流向比例
    data:
      - name: "續讀華德福高中"
        value: 45
      - name: "轉考公私立普高"
        value: 30
      - name: "技職體系(高職/五專)"
        value: 15
      - name: "出國留學"
        value: 5
      - name: "自學/其他機構"
        value: 5

analysis:
  comparison:
    title: 三大路徑：多維度比較分析
    subtitle: 選擇沒有絕對的好壞，只有適不適合
    chart_title: 路徑特性分布對比 (0-100)
    content: 我們從學業壓力、創意思考空間、社交多樣性等五個維度，比較「續讀華德福」、「公立普通高中」與「技職體系」的差異。
    radar:
      labels:
        [
          "學業考試壓力",
          "創意與自由度",
          "學費支出",
          "社交圈多樣性",
          "自主管理要求",
        ]
      datasets:
        - label: "續讀華德福"
          data: [20, 95, 80, 40, 90]
        - label: "公立普高"
          data: [95, 30, 20, 90, 60]
        - label: "技職體系"
          data: [60, 70, 30, 80, 70]
    waldorf:
      title: 續讀華德福 (Waldorf HS)
      content: 優勢在於心靈健康與創造力發展，社交圈較封閉但緊密。適合清楚自己志向、不適應填鴨式教育的孩子。家長需考慮較高昂的學費與未來的特殊升學管道（特殊選才）。
    mainstream:
      title: 普通高中 (Mainstream HS)
      content: 學業壓力極大，重視標準答案與考試技巧。社交圈廣闊但競爭激烈。適合學術傾向強、抗壓性高、希望能經由分科測驗進入傳統頂尖大學的學生。
    vocational:
      title: 技職體系 (Vocational)
      content: 強調「做中學」，與華德福教育理念有部分重疊（實作精神）。適合對特定領域（如設計、餐飲、農工）有明確興趣的孩子。
  success_factors:
    title: 轉軌成功 vs. 掙扎的關鍵因素
    content: 許多家長擔心孩子無法適應體制內的考試機器。數據顯示，華德福孩子在「自主學習」與「社團表現」上往往優於體制內學生，但在「標準化測驗」與「時間管理」初期會面臨巨大挑戰。
    chart_title: "核心能力對比評分 (0-100)"
    bar:
      labels:
        [
          "自主專題研究能力",
          "標準化考試技巧",
          "口語表達與簡報",
          "長時間專注記憶",
          "跨領域整合思考",
          "同儕競爭適應力",
        ]
      datasets:
        - label: "華德福學生優勢"
          data: [90, 20, 85, 40, 85, 50]
        - label: "體制內學生優勢"
          data: [50, 95, 60, 90, 50, 90]
    insight: "> **關鍵洞察**：成功轉軌的案例中，通常不是因為孩子原本就很會考試，而是因為他們擁有強大的「心理韌性」與「解決問題的能力」。"
  advice:
    title: 過來人的真實建議
    parent:
      title: 轉軌成功的家長
      content: '"剛進公立高中時，孩子對排名很感冒，成績一度墊底。但我們鼓勵他發揮華德福的『圖文整合能力』做筆記，後來他在探究實作課程大放異彩，找回了自信。"'
      badge: "適合：抗壓性高、對學科有興趣的孩子"
    student:
      title: 回流華德福的學生
      content: '"我去了一學期的私立高中，每天考試到晚上九點。我覺得自己像個填鴨機器，失去了對世界的好奇心。回到華德福高中部後，雖然資源較少，但我知道我在『活著』。"'
      badge: "適合：極需意義感、對藝術/實作敏感的孩子"
    vocational:
      title: 選擇技職(高職)的路
      content: '"華德福從小就在做木工、織布，所以我選手作性質強的科系非常適應。雖然學科有些吃力，但在實習課我幾乎是全班最快上手的。"'
      badge: "適合：動手能力強、學科興趣缺缺的孩子"

# 第三章：路徑深入探索 (現在使用 Switcher)
paths:
  title: 深度路徑探索
  subtitle: 請選擇您感興趣的路徑，了解更多細節、建議與時程

  waldorf:
    label: 續讀華德福
    desc: 深耕體系的完整教育
    title: 續讀華德福高中
    subtitle: 深耕體系的完整十二年一貫教育
    content: 選擇續留華德福體系的學生，能在青少年心理轉折的關鍵期，獲得最完整的人文支援。
    item_yuguang:
      title: 銜接昱光華德福
      content: 同心畢業生可優選銜接「昱光華德福實驗教育機構」。
    case_shi:
      title: 案例：石恩亞 (Shi En-ya)
      content: 現為運動媒體專欄作家。他認為華德福讓他保有自信去尋找並自學。
    advice:
      title: 回流生的心聲
      content: "回到華德福高中部後，我知道我在『活著』。"

  mainstream:
    label: 轉軌主流高中
    desc: 挑戰自我與跨體制適應
    title: 轉軌主流高中
    subtitle: 內在驅動力帶動的跨體制適應力
    content: 華德福孩子在國中階段培養的「洞察力」與「抗壓性」，能協助他們快速適應。
    item_transfer:
      title: 回歸主流體制與會考
      content: 雖然起初需適應考試技巧，但由於學習胃口未受損，通常能快速追平。
    case_academic:
      title: 案例：武陵高中與 5A10+
      content: 家長認為華德福培養的自主學習力極強，當孩子明白「為何而戰」時，進步速度驚人。
    advice:
      title: 家長轉銜心得
      content: "鼓勵他發揮圖文整合能力做筆記，後來他在探究實作課程大放異彩。"

    # 只有轉軌路徑才有的 Timeline
    timeline_title: 轉軌準備時程表
    timeline:
      items:
        - type: header
          title: 第一階段：探索與決策
          color: "#6A1B9A"
        - year: "8 年級下學期"
          title: 探索與意向
          content: 家庭深談與初步題型接觸。
        - year: "9 年級上學期"
          title: 心理調適期
          content: 在「畢業專題」與「總複習」之間取得平衡。
        - type: header
          title: 第二階段：衝刺與銜接
          color: "#E65100"
        - year: "9 年級下學期"
          title: 意志爆發期
          content: 5月會考，6月畢業公演/專題發表。
        - year: "10 年級"
          title: 跨文化適應
          content: 進入新環境後的適應衝擊。

  diverse:
    label: 自學與技職
    desc: 探索非傳統發展路徑
    title: 自學與多元職涯
    subtitle: 探索非傳統路徑的生命色彩
    content: 畢業生出路廣及自媒體與跨國讀書。華德福強調的靈活性，幫助他們發掘「新興職業」。
    item_special:
      title: 特殊選才與大學升學
      content: 「個人專題」是核心。透過特殊選才錄取清大、交大、北藝大等。
    advice:
      title: 技職生的優勢
      content: "華德福從小就在做木工，所以我選手作性質強的科系非常適應。"

footer:
  summary:
    title: 培養具備自轉能力的自由人
    content: 每一個靈魂都有適合他的土壤。本分析僅供參考，實際選擇請依據孩子的個別氣質與家庭狀況評估。
    button: 了解更多入學資訊
