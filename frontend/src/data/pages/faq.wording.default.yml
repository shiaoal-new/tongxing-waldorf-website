faq:
  curriculum:
    title: "教學內容與課程規劃"
    content: |
      同心華德福致力於提供符合孩子身心發展的深耕教育。

      **主課程 (Main Lesson)**
      每天上午安排連續兩小時的主課程，讓學員能在精神最集中的時段，針對特定學科進行深度的專題探究與沈浸式學習。

      **藝術與實手操作 (Artistic & Handwork)**
      課程中融入豐富的藝術元素，如音樂、濕水彩、木工與手工。透過意志、情感與思考的平衡發展，落實全人教育目標。

      **優律思美 (Eurythmy)**
      這是一門獨特的運動藝術，協助孩子發展空間感與內在節奏，並學習與群體和諧互動。

      **九年一貫學制**
      我們提供 1-9 年級的連貫學制，能大幅降低升學過渡期的適應壓力，讓師資與同儕關係維持長期的穩定支持。

  enrollment:
    title: "入學申請流程說明"
    content: |
      入學申請過程旨在協助家庭與機構達成教育共識。流程如下：

      1. **線上登記**：請至官方網站填寫初步報名表單。
      2. **電話洽詢**：如有疑問，歡迎於辦公時間聯繫行政團隊。
      3. **校園體驗**：預約校園導覽，實地感受教學環境與校園文化。

      **入學評估** 
      我們將舉辦家長說明會，並透過面談方式深入了解家庭的教育理念與孩子的成長需求。

  graduates:
    title: "畢業生的發展與競爭力"
    content: |
      家長常關注華德福畢業生在主流體系中的接軌情況。以下是我們的觀察：

      ### 核心競爭力
      華德福學生在自我探索與解決問題的能力上展現出卓越的適應力。他們具備高度的內在驅動力與終身學習的熱情。

      ### 學歷與銜接
      同心提供符合政府規範的畢業證書，學生可銜接國內外各類高中、大學與專業研究機構。

      ### 調查數據
      | 指標 | 學生特質說明 |
      | :--- | :--- |
      | **獨立性** | 具備強大的自我管理與決策能力。 |
      | **溝通協作** | 優秀的團隊合作精神與同理心。 |
      | **抗壓性** | 在變動環境中能維持穩定的心理韌性。 |

  school-bus:
    title: "交通接送與交通安排"
    content: |
      本機構目前暫不提供統一校車服務。

      **家長互助網絡**
      為了促進資源共享與社群聯繫，我們建立了家長互補接送的聯繫機制。

      這不僅解決了許多家庭的接送需求，更透過家長間的互動，深化了家校社群的凝聚力與互助精神。

  transition:
    title: "關於九年一貫學制的銜接"
    content: |
      雖然我們鼓勵學生完成完整的九年學程，以獲得最穩定的發展支持，但我們也充分理解家庭計畫的變動性。

      **學力銜接能力**
      經驗顯示，同心的學生具備優異的環境適應力與多元學習能力。

      即使中途轉入其他體制，學生通常能憑藉著穩固的學習基礎與自信心，在短時間內掌握新的評量規則，並在新的學習領域中脫穎而出。

  tuition:
    title: "各年級學費與收費標準"
    content: |
      同心本著資源公開與透明原則，學雜費主要用於維持教學環境品質與穩定專業師資團隊：

      - **初小與高小 (1-6年級)**：每學期 **85,000** 元
      - **中學 (7-9年級)**：每學期 **95,000** 元
      - **午餐費用**：每餐 **90** 元 (採用健康食材與平衡營養配置)

      這項教育投資旨在為孩子提供一個不被量化指標束縛、能真實成長的人文環境。

  time:
    title: 「我工作很忙，真的有時間參與嗎？」
    content: 每週 15 分鐘導師溝通、每學期 2-3 次社群活動，高效陪伴設計

  investment:
    title: 「學費投資能回收嗎？」
    content: AI 時代「定義問題」的人比「回答問題」的人值錢，投資的是孩子的未來競爭力

  adapt:
    title: 「轉學孩子能適應嗎？」
    content: 80% 轉學生第一學期找到節奏，專門的無縫銜接機制

  visit:
    title: 「參觀後發現不適合怎麼辦？」
    content: 免費參觀、無推銷壓力，親自感受後再決定
