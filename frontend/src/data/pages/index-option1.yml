title: "$seo.title"
slug: index-option1
seo:
  title: "$seo.title"
  description: "$seo.description"
hero:
  title: "$hero.title"
  subtitle: "$hero.subtitle"
  accent_text: "$hero.accent_text"
  buttons:
    - text: "$hero.button_visit"
      link: /visit
      style: btn-primary
  media_list:
    - type: video
      video: /img/hero-video-vp9.webm
      poster: /img/video-poster.webp
  layout: "Hero: 左下方文字方塊 (首頁風格)"
  divider:
    type: wave
    position: bottom
    color: fill-brand-bg

sections:
  # 1. 特色教學法 (學科學習)
  - section_id: academic_method
    blocks:
      - type: text_block
        title: "$academic.title"
        subtitle: "$academic.subtitle"
        content: "$academic.content"
      - type: curriculum_block

  # 2. 特色課程
  - section_id: featured_courses
    layout: 精緻特色區塊 (Features Premium)
    blocks:
      - type: text_block
        title: "$courses.title"
        subtitle: "$courses.subtitle"
      - type: list_block
        layout_method: featured_course_carousel
        item_type: feature_item
        buttons:
          - text: "$courses.button"
            link: /featured-courses
            style: btn-outline-primary
        items:
          - title: "$courses.humanities.title"
            span: 4
            icon: ph:book-open-text-bold
            content: "$courses.humanities.content"
            media:
              type: image
              image: /img/featured-academic.webp
          - title: "$courses.art.title"
            span: 4
            icon: ph:palette-bold
            content: "$courses.art.content"
            media:
              type: image
              image: /img/featured-artistic.webp
          - title: "$courses.nature.title"
            span: 4
            icon: ph:plant-bold
            content: "$courses.nature.content"
            media:
              type: image
              image: /img/featured-nature.webp
          - title: "$courses.outdoor.title"
            span: 4
            icon: ph:mountains-bold
            content: "$courses.outdoor.content"
            media:
              type: image
              image: /img/featured-outdoor.webp
          - title: "$courses.project.title"
            span: 4
            icon: ph:lightbulb-bold
            content: "$courses.project.content"
            media:
              type: image
              image: /img/featured-exploration.webp

  # 3. 跨越任務 (成長里程碑)
  - section_id: milestones
    silk_background: true
    blocks:
      - type: text_block
        title: "$milestones.title"
        subtitle: "$milestones.subtitle"
      - type: list_block
        layout_method: grid_cards
        item_type: feature_item
        items:
          - title: "$milestones.trekking.title"
            icon: lucide:mountain
            content: "$milestones.trekking.content"
          - title: "$milestones.project.title"
            icon: lucide:presentation
            content: "$milestones.project.content"
          - title: "$milestones.marathon.title"
            icon: lucide:flame
            content: "$milestones.marathon.content"

  # 4. 作息與節奏 (四季假)
  - section_id: rhythm
    blocks:
      - type: text_block
        title: "$rhythm.title"
        subtitle: "$rhythm.subtitle"
        content: "$rhythm.content"
      - type: breathing_intro_block
      - type: list_block
        layout_method: grid_cards
        item_type: feature_item
        items:
          - title: "$rhythm.seasons.spring"
            icon: lucide:sprout
          - title: "$rhythm.seasons.summer"
            icon: lucide:sun
          - title: "$rhythm.seasons.autumn"
            icon: lucide:leaf
          - title: "$rhythm.seasons.winter"
            icon: lucide:snowflake

  # 5. 未來藍圖 (畢業出路)
  - section_id: future
    layout: 精緻特色區塊 (Features Premium)
    blocks:
      - type: text_block
        title: "$future.title"
        subtitle: "$future.subtitle"
        content: "$future.content"
      - type: pie_chart_block
        title: "$future.chart.title"
        data: "$future.chart.data"

  # 6. 精簡版社群/效益
  - section_id: benefits_condensed
    silk_background: true
    blocks:
      - type: text_block
        title: "$benefits.title"
      - type: list_block
        layout_method: horizontal_scroll
        item_type: feature_item
        items:
          - title: "$benefits.university.title"
            icon: lucide:school
          - title: "$benefits.community.title"
            icon: lucide:users
          - title: "$benefits.support.title"
            icon: lucide:heart

  - section_id: faq
    blocks:
      - type: list_block
        layout_method: vertical
        item_type: faq_item
        faq_ids: [curriculum, graduates, transition]

  - layout: 紫色大型看板 (CTA)
    blocks:
      - type: text_block
        title: "$cta_bottom.title"
        content: "$cta_bottom.content"
      - type: cta_block
        buttons:
          - text: "$cta_bottom.button"
            link: /visit
            style: btn-inverse
