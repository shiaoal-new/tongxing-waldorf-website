title: "AI 來了，不用怕 | 同心華德福"
seo:
  title: "AI 世代生存指南 - 讓孩子贏在起跑點（是心理素質的起跑點） | 同心華德福"
  description: "當 ChatGPT 都能寫作文了，你的孩子還在背課文？來這裡，我們培養那些讓電腦當機的人類特質：搞怪、情感氾濫與超強心臟。"
hero:
  eyebrow: "Siri 可能很有禮貌，但它不會像我們這樣教孩子"
  title: "給孩子，AI 模擬不來的生命力"
  subtitle: "先不說學不學程式，在這個時代，先學會別被程式取代才是正經事。"
intro_ai_context:
  title: "2035 年，機器人統治地球...[？]{我們先教好孩子 }"
  subtitle: "別跟電腦比快，要比誰更像「人」"
  content: "專家說未來一半的工作都會消失（聽起來很驚悚對吧？）。與其擔心孩子工作被搶，不如擔心他們變成只會聽指令的工具人。華德福專門培養那些 AI 算不出來的東西：像是「為什麼天空是藍的？」這種無厘頭的好奇心，還有跌倒了能自己爬起來的超強心臟。"
core_abilities:
  title: "AI 學不會的 6 大絕招"
  subtitle: "這些技能書，我們從幼兒園就開始點"
  content: "Siri 可以幫你查天氣，但不能陪你淋雨；ChatGPT 可以寫情書，但不懂心跳加速的感覺。我們讓孩子在泥土裡打滾、在人與人的碰撞中長大（有時候確實會撞出包）。這些真實的痛感與手感，是虛擬世界給不了的抗體。"
  items:
    - title: "情緒韌性 (心臟練很大顆)"
      content: "【現狀】從小被分數追著跑，心碎跟喝水一樣平常。\n【同心】我們在泥土跟畫紙中打滾，練就一身「跌倒了拍拍屁股繼續玩」的厚臉皮神功。"
    - title: "問怪問題的能力 (Siri 會當機)"
      content: "【現狀】老師說什麼就是什麼，乖乖聽話最省心。\n【同心】我們先學會質疑，專門問出連 AI 都想罷工的人類靈魂大哉問。"
    - title: "原創力 (絕非複製貼上)"
      content: "【現狀】作業寫得再好也是參考範本來的。\n【同心】我們不玩複製貼上，專注開發那種讓演算法跑不動的原創生命力。"
    - title: "批判性思考 (大腦沒生鏽)"
      content: "【現狀】輸入什麼就吐出什麼，跟影印機沒兩樣。\n【同心】練習觀察真實，別想拿「AI 幻覺」來忽悠我們。"
    - title: "自主學習 (不用背後靈)"
      content: "【現狀】不拿鞭子在後面趕就不會動的人肉發電機。\n【同心】讓好奇心當燃料，我們自己設定導航線路。AI 只是導航工具，不是司機。"
    - title: "真實協作 (不是按讚而已)"
      content: "【現狀】坐在隔壁卻只會用訊息交流。\n【同心】練習那種 AI 模擬不來的臉紅心跳與義氣相挺。"
waldorf_approach:
  title: "慢一點，靈魂才跟得上"
  subtitle: "為什麼我們還在玩泥巴？"
  content: "矽谷大老都把孩子送來這種不給玩手機的學校，是不是有什麼陰謀？因為他們知道：如果你只會滑螢幕，就只能當消費者。我們用最原始的方式——唱歌、畫畫、做木工，喚醒孩子的大腦。當 AI 接管了無聊的工作，你的孩子就能專心做那些好玩、有創造力的大事。"
  items:
    - title: "玩真的：泥巴比 iPad 好玩"
      content: "在數位洪流中，過早的虛擬刺激會抹殺想像力。讓孩子親手觸摸泥土，感受真正的溫度與阻力，這種真實感是機器無法複製的生命根基。"
    - title: "練心臟：培養 AI 缺乏的同理溫度"
      content: "AI 擅長處理數據，卻不懂什麼是「眼淚」。透過真實的社群生活，我們引導孩子學習傾聽、共感與溝通，這是未來社會最稀缺的人性價值。"
    - title: "腦袋急轉彎：跳脫標準答案的邏輯"
      content: "面對 AI 能瞬間給出答案的現況，我們拒絕填鴨。從觀察現象開始，自己歸納邏輯。這種不被公式限制的思想自由，才是真智慧。"
future_advantage:
  title: "給未來的超級防護罩"
  subtitle: "先長成人，再長成材"
  content: "我們不是反科技狂，我們只是覺得孩子還小，別急著變生化人。越是在真實世界玩得夠瘋的孩子，未來越能駕馭那些冷冰冰的科技。"
  items:
    - title: "真偽辨識的導航力"
      content: "當 AI 內容淹沒世界，具備「真實感知」的人將成為極少數。我們訓練孩子的直覺，讓他們能在資訊洪流中看見真正的價值。"
    - title: "變形蟲般的生存力"
      content: "未來的職涯變動比天氣還快。我們培育的勇氣與韌性，讓孩子無論世界怎麼變，都能保持自信，在那裡都能活得很好。"
    - title: "定義問題的領導力"
      content: "當產出變得廉價，「知道要解決什麼問題」才是關鍵。我們保護了孩子的好奇心，讓他們成為未來社會中引領變革的開創者。"
cta:
  title: "別把孩子當機器人訓練"
  content: "如果不希望孩子被 AI 取代，就別用填鴨的方式教導他。來場說走就走的參訪，看看什麼叫「活生生」的教育。"
  button: "來去參訪野孩子們"
