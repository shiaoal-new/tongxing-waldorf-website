title: "seo.title"
slug: seasons-holiday
seo:
  title: "seo.title"
  description: "seo.description"
hero:
  title: "hero.title"
  subtitle: "hero.subtitle"
  accent_text: "hero.accent_text"
  media_list:
    - type: image
      image: /img/seasons-holiday/hero.webp
  layout: "Hero: 中央圖文 (願景頁風格)"
  divider:
    type: wave
    position: bottom
    color: fill-brand-bg

sections:
  - section_id: philosophy
    layout: "精緻特色區塊 (Features Premium)"
    blocks:
      - type: text_block
        title: "philosophy.title"
        subtitle: "philosophy.subtitle"
        content: "philosophy.content"
      - type: list_block
        layout_method: bento_grid
        item_type: feature_item
        items:
          - title: "philosophy.item_rhythm.title"
            span: 6
            content: "philosophy.item_rhythm.content"
            icon: lucide:clock
          - title: "philosophy.item_breathing.title"
            span: 6
            content: "philosophy.item_breathing.content"
            icon: lucide:wind

  - section_id: deep_time
    layout: "精緻特色區塊 (Features Premium)"
    silk_background: true
    blocks:
      - type: text_block
        title: "deep_time.title"
        subtitle: "deep_time.subtitle"
        content: "deep_time.content"
      - type: list_block
        layout_method: bento_grid
        item_type: feature_item
        items:
          - title: "deep_time.item_connection.title"
            span: 6
            content: "deep_time.item_connection.content"
            icon: lucide:tree-pine
          - title: "deep_time.item_quality.title"
            span: 6
            content: "deep_time.item_quality.content"
            icon: lucide:heart

  - section_id: festivals
    layout: "精緻特色區塊 (Features Premium)"
    blocks:
      - type: text_block
        title: "festivals.title"
        subtitle: "festivals.subtitle"
        content: "festivals.content"
      - type: list_block
        layout_method: bento_grid
        item_type: feature_item
        items:
          - title: "festivals.spring.title"
            span: 3
            content: "festivals.spring.content"
            icon: lucide:flower-2
          - title: "festivals.summer.title"
            span: 3
            content: "festivals.summer.content"
            icon: lucide:sun
          - title: "festivals.autumn.title"
            span: 3
            content: "festivals.autumn.content"
            icon: lucide:leaf
          - title: "festivals.winter.title"
            span: 3
            content: "festivals.winter.content"
            icon: lucide:snowflake

  - section_id: final
    layout: "Hero: 滿版背景圖文 (願景風格)"
    media_list:
      - type: image
        image: /img/vision-header.webp
    blocks:
      - type: text_block
        title: "summary.title"
        content: "summary.content"
      - type: cta_block
        buttons:
          - text: "summary.button"
            link: /
            style: btn-inverse
