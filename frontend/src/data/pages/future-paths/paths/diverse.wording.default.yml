paths:
  diverse:
    label: 其他多元選擇
    desc: 海內外跨界發展
    title: 其他多元升學管道
    subtitle: 出國留學、自學與特殊機構
    content: 除了高中體系外，部分家長與學生選擇了更具挑戰性的「非典型路徑」。這通常需要家庭極高的支持度與資源投入，但也能培育出獨特的世界觀。
    item_abroad:
      title: 提早出國留學
      content: 銜接海外 Waldorf 學校或一般中學。適合外語能力早熟、家庭有移民/駐外規劃的孩子。文化適應是一大挑戰。
    item_homeschool:
      title: 個人實驗教育 (自學)
      content: 針對有強烈個人興趣（如程式天才、藝術專精）的孩子，自組共學團體或在家自學。考驗家長的規劃能力。
    item_vtech:
      title: 特殊技職或藝術學校
      content: 直接進入音樂班、體育班或建教合作學校。適合性向非常明確、提早確定職業生涯的孩子。
    advice:
      title: 給家長的話
      content: "這條路人煙稀少，孩子可能會有孤獨感。確保孩子有參加校外社團或青少年活動，維持健康的社交網絡是非常重要的。此外，提早建立未來的能力清單與作品集，將是日後升學/就業的資本。"

    # 外部參考資料
    external_resources:
      title: 多元升學參考資源
      items:
        - title: "教育部實驗教育推動中心"
          content: "可以查詢全台最新的自學方案規定、資源申請與輔導機制。"
          icon: "lucide:file-text"
          buttons:
            - text: "前往推動中心"
              link: "https://teec.nccu.edu.tw/"
              style: "btn-outline"
        - title: "Taiwanese Study Abroad Groups"
          content: "許多臉書社團分享低齡留學的甘苦談與學校推薦。"
          icon: "lucide:plane"
          buttons:
            - text: "搜尋留學社群"
              link: "https://www.facebook.com/search/groups/?q=台灣留學"
              style: "btn-outline"
        - title: "特殊選才資訊介紹"
          content: "為非典型教育背景的學生，提供免考學測直升大學的管道說明。"
          icon: "lucide:star"
          buttons:
            - text: "看特殊選才整理"
              link: "https://www.unews.com.tw/school/news/64627"
              style: "btn-outline"

    # CTA
    cta:
      title: "尋找為您量身打造的航道"
      subtitle: "不論做什麼選擇，同心都是支持你們的後盾。歡迎與導師預約個別諮詢。"
      button_text: "預約升學諮詢"
