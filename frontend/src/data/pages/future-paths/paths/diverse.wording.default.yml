label: 技職、自學與多元
desc: 體制內的實作派與非傳統路徑
title: 多元路徑：技職、自學與海外
subtitle: 探索適合動手做與自主學習的生命色彩
content: 華德福孩子展現的「實作力」與「靈活性」，在技職體系或自學領域常能大放異彩。
item_vocational:
  title: 技術高中 (Vocational)
  content: 體制內的「實作派」。強調做中學，適合動手能力強、不想死讀書的孩子。壓力來源主要為技能檢定而非學科考試，與華德福的工藝精神高度契合。
item_special:
  title: 特殊選才與升學優勢
  content: 華德福高中的「畢業專題」是申請特殊選才的核心資產。許多畢業生憑藉深厚的自我覺察與對議題的論述能力，錄取清大、交大、北藝大等頂尖學府。
item_global:
  title: 國際流動與海外銜接
  content: 台灣華德福學生具備良好的國際流動性。部分家庭選擇在 9 年級後將孩子送往德國、澳洲或美國的華德福高中，無縫接軌當地的藝術與學術課程。
advice:
  title: 技職生的實作力
  content: "華德福孩子具備卓越的『動手做』精神。在注重實習的技術中學裡，這份對材料的敏感度與自律性常讓他們在專業科目上脫穎而出。"
