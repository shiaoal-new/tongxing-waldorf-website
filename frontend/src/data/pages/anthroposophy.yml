title: title
slug: anthroposophy
seo:
  title: seo.title
  description: seo.description
  keywords: seo.keywords
hero:
  title: hero.title
  subtitle: hero.subtitle
  accent_text: hero.accent_text
  media_list:
    - type: image
      image: /img/artifacts/human_wisdom.webp
  layout: "Hero: 中央圖文 (願景頁風格)"
  divider:
    type: wave
    position: bottom
    color: fill-brand-bg

sections:
  - section_id: what-is-it
    layout: 精緻特色區塊 (Features Premium)
    blocks:
      - type: text_block
        title: what-is-it.blocks.0.title
        subtitle: what-is-it.blocks.0.subtitle
        content: what-is-it.blocks.0.content
      - type: list_block
        layout_method: bento_grid
        item_type: feature_item
        align: center
        items:
          - title: what-is-it.blocks.1.items.0.title
            span: 4
            content: what-is-it.blocks.1.items.0.content
            icon: lucide:hand
            media:
              type: image
              image: /img/artifacts/tw_waldorf_gardening_1768617891526.webp
          - title: what-is-it.blocks.1.items.1.title
            span: 4
            content: what-is-it.blocks.1.items.1.content
            icon: lucide:palette
            media:
              type: image
              image: /img/artifacts/tw_waldorf_painting_1768617922808.webp
          - title: what-is-it.blocks.1.items.2.title
            span: 4
            content: what-is-it.blocks.1.items.2.content
            icon: lucide:lightbulb
            media:
              type: image
              image: /img/artifacts/tw_waldorf_science_logic.webp

  - section_id: relationship
    shader_gradient: true
    content_inside_wrapper: true
    layout: "Hero: 左方圖文 (通訊頁風格)"
    blocks:
      - type: text_block
        title: relationship.blocks.0.title
        subtitle: relationship.blocks.0.subtitle
        media:
          type: image
          image: /img/artifacts/anthroposophy_tree.webp
        content: relationship.blocks.0.content

  - section_id: seven-year-cycles
    layout: 精緻特色區塊 (Features Premium)
    blocks:
      - type: text_block
        title: seven-year-cycles.blocks.0.title
        subtitle: seven-year-cycles.blocks.0.subtitle
        content: seven-year-cycles.blocks.0.content
      - type: list_block
        layout_method: bento_grid
        item_type: feature_item
        align: center
        items:
          - title: seven-year-cycles.blocks.1.items.0.title
            span: 4
            content: seven-year-cycles.blocks.1.items.0.content
            icon: lucide:baby
            media:
              type: image
              image: /img/artifacts/tw_waldorf_circle_1768617908506.webp
          - title: seven-year-cycles.blocks.1.items.1.title
            span: 4
            content: seven-year-cycles.blocks.1.items.1.content
            icon: lucide:brush
            media:
              type: image
              image: /img/featured-artistic.webp
          - title: seven-year-cycles.blocks.1.items.2.title
            span: 4
            content: seven-year-cycles.blocks.1.items.2.content
            icon: lucide:brain
            media:
              type: image
              image: /img/featured-exploration.webp

  - section_id: why-it-matters
    silk_background: true
    divider:
      type: wave
      position: bottom
      color: fill-brand-bg
    blocks:
      - type: text_block
        title: why-it-matters.blocks.0.title
        subtitle: why-it-matters.blocks.0.subtitle
        content: why-it-matters.blocks.0.content
      - type: cta_block
        buttons:
          - text: why-it-matters.blocks.1.buttons.0.text
            link: /visit
            style: btn-primary
          - text: why-it-matters.blocks.1.buttons.1.text
            link: /curriculum-development
            style: btn-outline-primary

  - section_id: conclusion_cta
    layout: 紫色大型看板 (CTA)
    blocks:
      - type: text_block
        title: conclusion_cta.blocks.0.title
        content: conclusion_cta.blocks.0.content
      - type: cta_block
        buttons:
          - text: conclusion_cta.blocks.1.buttons.0.text
            link: /visit
            style: btn-inverse
