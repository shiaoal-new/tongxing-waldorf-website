title: "$title"
slug: future-education
seo:
  title: "$seo.title"
  description: "$seo.description"
hero:
  title: "$hero.title"
  subtitle: "$hero.subtitle"
  layout: "Hero: 左下方文字方塊 (首頁風格)"
  media_list:
    - type: video
      video: /img/index/future-world.mp4
      mobileVideo: /img/index/future-world-mobile.mp4
      poster: /img/index/future-world-poster.webp
      mobilePoster: /img/index/future-world-poster-mobile.webp

sections:
  - section_id: intro_ai_context
    blocks:
      - type: text_block
        title: "$intro_ai_context.title"
        subtitle: "$intro_ai_context.subtitle"
        content: "$intro_ai_context.content"
        layout: centered

  - section_id: core_abilities
    blocks:
      - type: text_block
        title: "$core_abilities.title"
        subtitle: "$core_abilities.subtitle"
        content: "$core_abilities.content"
      - type: list_block
        layout_method: spotlight_carousel
        item_type: feature_item
        items:
          - title: "$core_abilities.items.0.title"
            icon: lucide:heart-handshake
            content: "$core_abilities.items.0.content"
          - title: "$core_abilities.items.1.title"
            icon: lucide:message-circle-question
            content: "$core_abilities.items.1.content"
          - title: "$core_abilities.items.2.title"
            icon: lucide:palette
            content: "$core_abilities.items.2.content"
          - title: "$core_abilities.items.3.title"
            icon: lucide:brain-circuit
            content: "$core_abilities.items.3.content"
          - title: "$core_abilities.items.4.title"
            icon: lucide:sparkles
            content: "$core_abilities.items.4.content"
          - title: "$core_abilities.items.5.title"
            icon: lucide:users-round
            content: "$core_abilities.items.5.content"

  - section_id: waldorf_approach
    silk_background: true
    blocks:
      - type: text_block
        title: "$waldorf_approach.title"
        subtitle: "$waldorf_approach.subtitle"
        content: "$waldorf_approach.content"
      - type: list_block
        layout_method: vertical
        item_type: feature_item
        items:
          - title: "$waldorf_approach.items.0.title"
            icon: lucide:hand-metal
          - title: "$waldorf_approach.items.1.title"
            icon: lucide:heart
          - title: "$waldorf_approach.items.2.title"
            icon: lucide:lightbulb

  - section_id: future_advantage
    layout: 精緻特色區塊 (Features Premium)
    blocks:
      - type: text_block
        title: "$future_advantage.title"
        subtitle: "$future_advantage.subtitle"
        content: "$future_advantage.content"
      - type: list_block
        layout_method: vertical
        item_type: feature_item
        items:
          - title: "$future_advantage.items.0.title"
            icon: lucide:fingerprint
          - title: "$future_advantage.items.1.title"
            icon: lucide:compass
          - title: "$future_advantage.items.2.title"
            icon: lucide:handshake

  - layout: 紫色大型看板 (CTA)
    blocks:
      - type: text_block
        title: "$cta.title"
        content: "$cta.content"
      - type: cta_block
        buttons:
          - text: "$cta.button"
            link: /visit
            style: btn-inverse
