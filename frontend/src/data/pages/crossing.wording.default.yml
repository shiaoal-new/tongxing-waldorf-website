seo:
  title: 跨越：陪伴成長的里程碑任務
  description: 同心華德福的「跨越任務」是一系列根據人智學發展設計的里程碑課程，陪孩子從夢幻走向自由。

hero:
  title: 跨越
  subtitle: 丈量世界的腳步，長出勇敢自轉的力量

intro:
  title: 意志的成長與邊界的擴展
  subtitle: 配合發展圖像的里程碑
  content: 跨越任務通常與「自然日」旅程緊密結合。隨著年段增長，挑戰的難度與離家距離逐步擴大，見證孩子從依賴走向獨立的過程。

primary:
  title: 低年段：建立入世的根基
  subtitle: 第一次的離家與自我照顧
  g3:
    title: 三年級：校內宿營與入世
    content: 孩子生命中第一個重要里程碑，第一次離家宿營，並親自為全班設計菜單與烹煮晚餐，象徵真實意志的入世。
  g4:
    title: 四年級：農場宿營與邊界
    content: 走出都市場域，進行三天兩夜的農耕勞動體驗，感受天、地、人與動物之間的連結。

middle:
  title: 中高年段：意志與群體協作
  subtitle: 在自然挑戰中磨練意志
  g5:
    title: 五年級：台北大縱走（和諧）
    content: 分段走完官房規定的七段路線，用雙腳丈量家鄉，在疲憊時透過同儕扶持完成挑戰。
  g6:
    title: 六年級：山林跨越（規矩）
    content: 五天四夜的深山宿營，在嚴謹的規律中學習高度的團隊互助，迎接青春期的前奏。

secondary:
  title: 中學部：自我探索與壯遊
  subtitle: 邁向自由的最終跨越
  g7:
    title: 七年級：獨木舟任務（探索）
    content: 親手打造獨木舟並划向大海，象徵青少年帶著信念與熱情探索未知的社會海洋。
  g8:
    title: 八年級：獨處體驗（革命）
    content: 36 至 48 小時的無 3C 獨處（Solo），在寧靜中探問「我是誰」，完成內在的洗禮。
  g9:
    title: 九年級：馬偕之路（理想）
    content: 畢業前的最終跨越，徒步重走馬偕之路，準備好帶著負責任的勇氣走出自由之路。

summary:
  title: 長出「自轉」的能力
  content: 同心的跨越任務不僅是體能挑戰，更是身心靈的整合教育。孩子在汗水與困難中學會自主學習與解決問題，讓他們在離開校園後，也能從容找到自己的位置。
  button: 回到首頁
