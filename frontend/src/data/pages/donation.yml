title: $title
slug: donation
hero:
  title: $hero.title
  subtitle: $hero.subtitle
  media_list:
    - type: image
      image: /img/artifacts/tw_waldorf_painting_1768617922808.webp
  layout: "Hero: 左下方文字方塊 (首頁風格)"
  divider:
    type: wave
    position: bottom
    color: fill-brand-bg
sections:
  - section_id: mission
    layout: "突出標題風格"
    blocks:
      - type: text_block
        title: $mission.blocks.0.title
        content: $mission.blocks.0.content
      - type: list_block
        layout: grid_cards
        item_type: feature_item
        items:
          - title: $mission.blocks.1.items.0.title
            icon: lucide:users
            content: $mission.blocks.1.items.0.content
            media:
              type: image
              image: /img/artifacts/tw_calm_family_secure_1768617979428.webp
          - title: $mission.blocks.1.items.1.title
            icon: lucide:home
            content: $mission.blocks.1.items.1.content
            media:
              type: image
              image: /img/artifacts/tw_waldorf_gardening_1768617891526.webp
          - title: $mission.blocks.1.items.2.title
            icon: lucide:book-open
            content: $mission.blocks.1.items.2.content
            media:
              type: image
              image: /img/artifacts/tw_teacher_parent_connection_1768617938384.webp

  - section_id: how-to
    layout: "精緻特色區塊 (Features Premium)"
    blocks:
      - type: text_block
        title: $how-to.blocks.0.title
        subtitle: $how-to.blocks.0.subtitle
        content: $how-to.blocks.0.content
      - type: list_block
        layout: bento_grid
        item_type: feature_item
        items:
          - title: $how-to.blocks.1.items.0.title
            span: 6
            content: $how-to.blocks.1.items.0.content
            icon: lucide:credit-card
          - title: $how-to.blocks.1.items.1.title
            span: 6
            content: $how-to.blocks.1.items.1.content
            icon: lucide:hand-metal

  - section_id: contact
    layout: 紫色大型看板 (CTA)
    divider:
      type: curve
      position: top
      color: fill-brand-bg
      flip: true
    blocks:
      - type: text_block
        title: $contact.blocks.0.title
        content: $contact.blocks.0.content
      - type: cta_block
        buttons:
          - text: $contact.blocks.1.buttons.0.text
            link: "mailto:office@tongxing.org.tw"
            style: btn-inverse
          - text: $contact.blocks.1.buttons.1.text
            link: "#"
            style: btn-white
