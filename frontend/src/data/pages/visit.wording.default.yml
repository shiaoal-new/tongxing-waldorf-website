title: 預約參觀 | 同心華德福
content: 告別螢幕上的文字，親自走入這座「教育新燈塔」，親手感覺孩子生命成長的頻率。
hero:
  eyebrow: 致還在傳統教育中尋找出口的家長
  title: 親眼見證，孩子重拾學習熱情的那個瞬間
  sub_title: 歡迎親臨深坑「大學校區」，這不僅是一場校園探訪，更是一次重新定義孩子未來的對話。
process:
  blocks:
    - title: 深度探索之旅
      subtitle: 為什麼非得現場走一趟？
      content: 與其在螢幕前猜測，不如直接感受。我們設計了三階段的高質感參訪，讓你從環境、氛圍到師生互動，全方位穿透華德福教育的核心。
schedule:
  blocks:
    - title: 聽見未來的召喚
      subtitle: 預約深度對話
      content: 為了確保每一位訪客都能獲得最高品質的解答，我們每日僅開放少量預約名額。請選擇適合您的時段。
