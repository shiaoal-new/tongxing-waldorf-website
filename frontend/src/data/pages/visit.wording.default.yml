title: 預約參觀
content: 歡迎親臨同心華德福位於深坑「大學校區」的新校址，體驗專業與靈性共榮的教育地標。
hero:
  title: 開箱教育新燈塔
process:
  blocks:
    - title: 參觀流程
      subtitle: 流程說明
      content: 歡迎來學校走走、聊聊。實際看看孩子們上課的樣子，跟老師聊聊你的疑問，會比網站上的文字更有感覺。
schedule:
  blocks:
    - title: 參觀場次
      subtitle: 預約場次
      content: 請選擇適合您的場次進行預約，名額有限，額滿為止。
