seo:
  title: 同心華德福 | 台北深坑全人教育與華德福實驗教育首選
  description: 台北市同心華德福實驗教育機構位於深坑，提供1-9年級完整的華德福九年一貫學制。在此變動時代，我們以身心靈全面發展為核心，陪孩子長成穩定、有創意的自由人。

hero:
  title: 同心華德福
  subtitle: 深坑裡的暖暖包：給孩子一個「像人」的生長空間
  accent_text: 點亮新北市的教育地標
  button_visit: 預約參觀 (來喝杯茶)
  subtext: 保證不推銷豆腐，這點我們可以先說清楚。

features:
  intro:
    title: 本校在深坑做什麼 [？]{不是賣豆腐}
    subtitle: 紮根土地的素養教育
  item_university:
    title: 拒絕圍牆：在 5 萬坪大學校園裡「跑酷」長大
    content: 都市小孩的視野常被螢幕跟水泥牆塞爆 (這真的很悶)。我們直接把學校搬進大學校區，資源借好借滿。讓孩子的感官在泥土跟微風中甦醒，建立 AI 時代最欠缺的「真實體覺」。(跑斷腿都沒問題)
    button: 預約正式參觀 (來喝杯茶)
  item_curriculum:
    title: 告別死讀書：把「寫考卷」的時間拿來「練功」
    content: 傳統學科往往跟現實脫鉤 (讀完還是不知道怎麼修水龍頭)。我們把 108 課綱玩成實踐課，把知識變成孩子手部跟心靈的執行力。素養不是口號，是解決真實問題的能力。
    button: 探討教育理念
  item_marathon:
    title: 終結轉銜焦慮：這場 9 年馬拉松，我們陪你跑
    content: 實驗教育最怕讀到一半學校「不見了」 (嚇死人)。我們提供 1-9 年級完整學制，讓師生建立那種「眼神交流就知道你在想什麼」的深厚信任，守護孩子最需要的心理安全感。
    button: 瀏覽課程綱要

experience:
  intro:
    title: 別讓標準答案，把孩子眼裡的火種給滅了
    subtitle: 同心特有的教育體驗
  item_spark:
    title: 奪回好奇心：從象形到詩篇的「尋根」之旅
    content: 當知識變成枯燥的考卷，學習就成了負擔。我們從古老的象形文字起源點火，用故事跟圖像取代死記，讓孩子對世界始終保持著「這什麼？這怎麼做的？」的純真渴望。
  item_mainbook:
    title: 拒絕公版：親手書寫這輩子第一本「大作」
    content: 機器生成的筆記沒有靈魂 (ChatGPT 寫得再好也不是你的)。在同心，每個小孩都親手繪製專屬的「工作本」。這不只是筆記，是他們跟知識深度對話後的生命結晶，原創精神就是這樣練出來的。
  item_crossing:
    title: 拒絕平庸：用「年度跨越任務」打造內在英雄
    content: 孩子需要知道自己「真的行」。透過每學年量身打造的挑戰任務，孩子在解決難題中擊敗恐懼，親自證實自己的成長。這不是考試，這是人生升級的過程。
    button: 了解各年級跨越任務
  item_seasonal:
    title: 奪回家庭品質：人性化的四季假 (避開人潮的神物)
    content: 被補習班塞滿的寒暑假真的不叫休息。我們有符合生命律動的四季假，讓家庭能避開人擠人的尖峰 (省錢又省心)。在最適宜的季節全心陪伴孩子，找回那種「全家在一起真好」的連結。
    button: 了解作息節奏
  item_future_gap:
    title: 終點不是懸崖：培育自帶「反脆弱」屬性的卒業生
    content: 華德福孩子畢業後去哪？這題家長常問到缺氧。事實是：他們展現了強大的環境韌性。他們不只是學術上的佼佼者，更是那種丟到火星都能活下去、還能順便種出馬鈴薯的引領者。
    button: 畢業生發展足跡
ai_future:
  intro:
    title: 2035 年，如果機器人統治地球... [？]{我們讓孩子變強就好}
    subtitle: 給孩子 AI 模擬不來的生命力
    content: 當生成式 AI 幾秒鐘就寫完報告時，知識填充已經沒用了。同心致力於守護那些機器人當機也寫不出來的人性核心：好奇心、創造力，還有強大到不行的心理韌性。
    button: 探索 AI 時代的強項 (AI 不要看)
  item_soft_skills:
    title: 培養「無法被自動化」的人性靈魂
    content: 機器擅長算邏輯，但人類擅長同理。我們在中學階段深耕藝術跟思辨，讓孩子具備感知能力。要做駕馭工具的人，而不是被工具取代的螺絲釘。
  item_adaptability:
    title: 讓家長安心：廣闊且有韌性的未來路徑
    content: 畢業生在銜接高中大學時，適應力強到讓老師驚訝。這種教育方式不是在躲避世界，而是賦予孩子在亂世中「生存且茁壯」的真實武器。安心啦，路廣得很。

community:
  intro:
    title: 育兒不該是一場孤獨的馬拉松 (抱一個)
    subtitle: 找回那個互助的村落
    content: 台北生活讓家長在家庭跟職場面對雙重焦慮，常感到孤軍奮戰。同心不只是學校，更是一個「共學村落」，讓你在這條路上有最溫馨的戰友支援。
    button: 深入了解親師合作 (不孤單)
  item_connection:
    title: 老師懂孩子，更懂想哭的你
    content: 我們的老師不只是負責打分數的機器人。除了懂孩子，他們更會花時間聽家長吐苦水 (這很重要！)。當親師變成戰友，教育才不會變成「各說各話」的羅生門。這種革命情感，是為了讓孩子知道我們是同一國的。
    button: 認識我們的老師
  item_support:
    title: 最強奧援：「小孩放著，我來！」
    content: 這裡的家長群組，比里長辦公室還熱血。誰家臨時有事，「我去接！」、「來我家吃飯！」此起彼落。這不是客套，是真實的戰友情誼 (畢竟大家都經歷過崩潰時刻)。我們一起決定午餐、美化校園，甚至一起帶孩子長大。
    button: 了解校園生活節奏
  item_secure:
    title: 家長不焦慮，小孩才敢放心長大
    content: 為什麼我們要搞得這麼「親密」？因為我們發現，當大人有足夠的安全感和支援網，孩子那雙看世界的眼睛也會跟著安穩下來。在一個被愛與信任包圍的「村子」裡長大，孩子的腳步會比別人更穩。這場長跑，一群人跑才像是在度假。
    button: 支持同心永續發展

videos:
  intro:
    title: 沒圖沒[真相]{直接看影片}
    subtitle: 深入了解華德福
    content: 文案寫得再天花亂墜，不如看真的。這些影片記錄了孩子、老師、家長的真實日常——有笑有淚，可能還有點混亂 (笑)，但這就是我們最真實的樣子。
    button: 探索特色課程
  item_essence:
    title: 同心華德福教育8分鐘精華
    content: 如果你也在想「除了補習、考試，還有別的路嗎？」——這支 8 分鐘的紀錄短片將帶你走進校園，看見孩子最真實的學習樣貌與生命力。
  item_golden_line:
    title: 與孩子的黃金線
    content: 小學老師跟孩子之間，有種說不出的默契。那條看不見的連結，會陪著孩子走過整個童年，建立最穩固的情感基礎。
  item_revolution:
    title: 中學的自我革命
    content: 青春期的孩子開始問「我是誰」。我們不給標準答案，而是創造空間，陪他們在藝術與思辨中找到屬於自己的答案。

testimonials:
  intro:
    title: 聽聽過來人怎麼[說]{絕無業配}
    subtitle: 家長與老師的真心話大冒險
  items:
    - quote: "以前連拿筆都像在拿千斤頂(眼神死)，現在寫作業卻像在練功還自帶聖光。不用再逼孩子算數學算到懷疑人生，這裡讓他們找回『學習的胃口』(是真的胃口，學校飯很好吃)。"
      author: 秀萍
      title: 資深家長 (三個孩子都被收服了)
    - quote: "來這裡當家長比上班還累(誤)，但其實是在補修自己的童年。本來以為是來陪讀，結果自己玩得比小孩還瘋。這裡不只是學校，根本是『極限生存村落』，但大家依舊樂在其中。"
      author: 林妙禪
      title: 家長 (比小孩還愛上學的資深夥伴)
    - quote: "帶小孩去走『台北大縱走』，本來以為會上演『背我回家』的八點檔，結果這群孩子腿斷了都要走完(驚)。原來意志力是這樣練出來的，以後不怕他們去跑馬拉松了。"
      author: 佩佩
      title: 家長 (被小孩體力嚇到的隨行家長)
    - quote: "我們不把小孩當罐頭生產，那樣太無聊了。這裡是『手工訂製』的教育，看懂每個孩子的怪...呃，是獨特之處。協助他們長成自己想要的樣子，雖然有時候長得太有創意了點。"
      author: 建龍 老師
      title: 資深導師 (專治各種疑難雜症)
    - quote: "你看我拿木工刀跟毛線針，以為我在教才藝？其實我在教『定力』(不然小孩會拆房子)。看著老師專注的背影，這群猴子...我是說孩子，也會跟著安靜下來(神奇吧)。"
      author: 佩宜 老師
      title: 手工與藝術教師 (孩子眼中的魔術師)
    - quote: "戲劇課就是讓害羞鬼變身，你會看到平常不講話的孩子在台上大吼大叫(感動的那種)。藝術治療了靈魂，也拯救了老師的喉嚨(不用一直罵人)。"
      author: 古峰 老師
      title: 戲劇課教師 (靈魂工程師)
    - quote: "這裡最厲害的就是『把家長拖下水』(笑)。我們是把親師生綁在一條船上，大家都是船長。因為信任，所以這裡的社群像個大家庭，偶爾也會吵架啦，但感情越吵越好。"
      author: 鄭同僚 教授
      title: 同心創辦人 (大家的船長)
    - quote: "別拿以前那套來框現在的小孩，會被笑。我們要教的是『自轉』的能力(不是原地轉圈圈)。當孩子知道自己是誰，丟到火星都能活下去(應該啦)。"
      author: 王智弘 老師
      title: 資深華德福導師 (來自未來的引路人)
    - quote: "我們不只在深坑蹲點，還跟全世界連線(很國際化喔)。目標是把孩子養得『根深葉茂』，既有台灣味，又有世界觀，簡直是教育界的珍珠奶茶。"
      author: 詹雅智 老師
      title: 同心執行長 (努力把大家連結在一起)

faq:
  intro:
    title: 常見問答 (誠實豆沙包版)
    subtitle: FAQ
    content: 學費多少？畢業去哪？會不會餓死？ (誤)。那些你想問又不敢開口的，我們都懂。這裡有誠實豆沙包等級的回答，不轉彎抹角，直接給你真相。

cta_bottom:
  title: 還是不放心？直接來看最快
  content: 網頁做得再美也是虛的 (我們很誠實)。歡迎直接殺到深坑大學校區，親眼看看這群像野孩子一樣快樂、又像哲學家一樣深沉的學生。感受一下那個「暖火」到底有沒有在燒。
  button: 好啦，我去預約參觀看看
  subtext: 門票 0 元，喝茶聊天不用錢。
