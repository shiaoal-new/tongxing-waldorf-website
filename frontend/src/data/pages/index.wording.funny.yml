seo:
  title: 同心華德福 | 台北深坑華德福教育實驗機構 (AI 時代的避風港)
  description: 同心華德福致力於提供符合孩子身心發展的教育，透過 1-9 年級九年一貫學制，培育在 AI 時代具備平衡身心靈與原創靈魂的未來自由人。

hero:
  title: 別怕！就算 2035 年機器人統治地球...
  subtitle: 領航 AI 時代的「自由人」培育基地 (就在深坑)
  button_visit: 預約參觀 (保證不推銷豆腐)
  subtext: 60 分鐘深度導覽 (純品茶，不推銷)

