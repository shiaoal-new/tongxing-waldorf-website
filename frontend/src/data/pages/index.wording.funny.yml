experience:
  intro:
    title: 別讓標準答案，把孩子眼裡的火種給滅了
    subtitle: 同心特有的教育體驗
  item_spark:
    title: 奪回好奇心：點燃 100% 主動探究的教育火種 (拒絕當句點王)
    content: 當知識變成枯燥的考卷，學習就成了負擔。我們從古老的象形文字起源點火，用故事跟圖像取代死記，讓孩子對世界始終保持著 100%「這什麼？這怎麼做的？」的純真渴望。
  item_mainbook:
    title: 拒絕公版：在 AI 時代，培育機器無法複製的「原創靈魂」
    content: ChatGPT 寫得再好也不是你的靈魂。在同心，每個孩子都親手繪製專屬的工作本。這不只是筆記，是他們跟知識深度對話後的生命結晶。透過這輩子的第一本「個人著作」，孩子將長出無可取代的原創精神，成為定義問題的領航員。
  item_crossing:
    title: 拒絕平庸：以年度跨越任務建構內在英雄
    content: 孩子需要知道自己「真的行」。透過每學年量身打造的跨越任務，孩子在挑戰中擊敗恐懼，親自證實自己的成長，將內在能量轉化為現實世界的執行力。這不是考試，這是人生升級。
    button: 了解各年級跨越任務
  item_seasonal:
    title: 擺脫疲憊節奏：每年 4 段深層連結的「家庭黃金假」
    content: 被補習班塞滿的寒暑假真的不叫休息。我們有符合生命律動的四季假，讓家庭每年擁有 4 段避開人潮的黃金假期 (省錢又省心)，在最適宜的季節找回親子間深層的連結。
    button: 了解作息節奏
  item_future_gap:
    title: 終結未來憂慮：培育自帶「反脆弱」屬性的畢業生
    content: 華德福孩子畢業後去哪？這題家長常問到缺氧。華德福畢業生在銜接時展現出強大的環境韌性與自主學習力。他們不只是學術上的佼佼者，更是那種丟到火星都能活下去、還能順便種出馬鈴薯的引領者。
    button: 畢業生發展足跡

ai_future:
  intro:
    title: 2035 年，您的孩子將面對什麼樣的世界？ [？]{我們讓孩子變強就好}
    subtitle: 給孩子 AI 模擬不來的生命力
    content: 當生成式 AI 幾秒鐘就寫完報告時，教育的重點不再是知識填充。同心致力於守護那些機器人當機也寫不出來的人性核心：好奇心、創造力，還有強大到不行的心理韌性。
    button: 探索 AI 時代的強項 (AI 不要看)
  item_soft_skills:
    title: 培養「無法被自動化」的人性核心
    content: 機器擅長算邏輯，但人類擅長同理與直覺。我們在中學階段深耕藝術與思辨，讓孩子具備強大的感知能力，成為能駕馭工具而非被工具取代的人。要做駕駛員，而不是螺帽。
  item_adaptability:
    title: 具備「提出對的問題」的批判性思維 (AI 沒這招)
    content: 當 AI 在毫秒間吐出答案，未來的領袖需要的是「辨識真偽」與「提出好問題」的能力。我們從中小學的跨領域探究開始，深耕獨立思考，讓孩子不只會解題，更能精準定義問題。

community:
  intro:
    title: 育兒不該是一場孤獨的馬拉松 (抱一個)
    subtitle: 建立支持成長的師生社群
    content: 台北忙碌的生活讓家長在育兒與職場間疲於奔命，常感到焦慮與孤立。同心不只是學校，更是一個「共學村落」，讓你在教育路上擁有最溫溫暖的戰友。
  item_connection:
    title: 深度同理的親師戰友：每週 15 分鐘建立「黃金溝通線」
    content: 我們不聊廢話，而是聚焦學生的心理成長與家庭支持。比起一年一度的家長會，這裡每週 15 分鐘的深度交流，能為孩子建立一條守護 9 年的健康黃金線。溝通頻率高到你懷疑人生，但小孩長得超穩。
    button: 認識教育團隊
  item_support:
    title: 實踐共學共榮：超過 95% 家長推薦的支撐網絡
    content: 教育不該是一場孤獨的修行。同心社群展現了高達 95% 以上的互助滿意度，家長之間共享資源與支援。在台北這座孤島，我們為您找回一個能互相依靠、共同把孩子養大的「教育村落」。
    button: 了解校園生活
  item_secure:
    title: 建立 100% 的信任感：家長血壓穩了，小孩就安了
    content: 當大人不再焦慮，孩子才能 100% 放心長大。我們透過社群的力量，將家長對升學與未來的焦慮，轉化為陪伴孩子成長的穩定動能。在被愛跟信任填滿的成長沃土長大，真的比較穩。
    button: 支持教育願景

videos:
  intro:
    title: 沒圖沒 [真相]{直接看影片}
    subtitle: 華德福教學現場直擊
    content: 我們透過影像紀錄，真實呈現在校園中發生的教學火花與師生對話。透過這些珍貴的鏡頭，您可以更直觀地理解華德福教育如何溫潤地與心靈接軌。
  item_essence:
    title: 累積 1000+ 日的操作紀錄：九年一貫教育精華
    content: 透過 8 分鐘的紀實短片，看見我們如何在這 9 年、超過 3000 個日子裡，平衡學力培育與身心發展，展現華德福教育在台灣本土實踐的豐碩成果。直接看，最有感。
  item_golden_line:
    title: 師生之間的生命連結 (那條看不見的線)
    content: 小學導師與學生之間深厚的契合度，這種長期且穩定的陪伴，是發展心理學中至關重要的基石。這條線會陪著孩子走過整個童年。
  item_revolution:
    title: 中學時期的個體化思辨過程 (自我革命)
    content: 紀錄中學生如何在藝術專案與理科探究中，逐步發展出獨立思考的能力與對自我的認同感。青春期不一定要只有叛逆。

not_for_everyone:
  intro:
    title: 說實話，我們可能不適合您 [！]{不合則散 (笑)}
    subtitle: 有緣無份？先看這份「不合清單」
    content: 同心華德福並非傳統私立學校，這條路徑需要極高共識。若您對教育的期待屬於以下三種類型，我們誠實建議您考慮別家：
  item_grades:
    title: 僅追求完美分數與升學排名
    content: 如果您認為學業重點是贏在起跑點、提早刷題與頻繁測驗，同心悠哉的「吸吐節奏」會讓您血壓升高。我們教的是「跑得遠」，而不是「搶拍」。
  item_hands_off:
    title: 尋找「全包式」升學保母服務
    content: 我們不提供將教育外包的選項。同心的教育是一場「親、師、生」的三方共工，需要家長願意投入時間參與社群。如果您只想把教育「丟包」，那是隔壁補習班才有。
  item_status:
    title: 期望用私校標籤建立階級感
    content: 若您尋找的是穿西裝的菁英貴族感，同心會讓您失望。我們是一群踩在泥土裡的實戰派家長，重視樸實、自然，讓孩子學會捲起袖子解決問題。
  outro:
    subtext: 呼...如果以上三點您都完美避開，恭喜！您就是我們要找的靈魂戰友。歡迎加入這場翻轉教育的旅程。
    button: 這正是我在尋找的，預約參觀 (準備好掉坑了)

faq:
  intro:
    title: 放心，您的疑慮我們都聽見了
    subtitle: FAQ (誠實豆沙包版)
    content: 學費多少？畢業去哪？會不會餓死？每個家庭在選擇教育時都會有顧慮，這些問題我們已經回答過無數次。這裡有誠實豆沙包等級的解答，直接給你真相。

cta_bottom:
  title: 親身體驗教育的溫度
  content: 您可以直接蒞臨新北市深坑大學校區，親眼看看這群像野孩子一樣快樂、又像哲學家一樣深沉的學生。感受一下那個「暖火」到底有沒有在燒。
  button: 好啦，我去預約參觀看看
  subtext: 免費預約，純喝茶聊天不用錢。
