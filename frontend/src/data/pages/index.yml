title: "$seo.title"
slug: index
seo:
  title: "$seo.title"
  description: "$seo.description"
  keywords: 同心華德福, 台北實驗教育, 華德福教育, 深坑教育, 全人教育, 九年一貫, 108課綱
hero:
  title: "$hero.title"
  subtitle: "$hero.subtitle"
  accent_text: "$hero.accent_text"
  buttons:
    - text: "$hero.button_visit"
      link: /visit
      style: btn-primary
  subtext: "$hero.subtext"
  media_list:
    - type: video
      video: /img/index/hero-background.mp4
      mobileVideo: /img/index/hero-mobile.mp4
      poster: /img/index/hero-poster.webp
      mobilePoster: /img/index/hero-poster-mobile.webp
  layout: "Hero: 左下方文字方塊 (首頁風格)"
  divider:
    type: wave
    position: bottom
    color: fill-brand-bg
sections:
  - section_id: experience
    layout: 精緻特色區塊 (Features Premium)
    blocks:
      - type: text_block
        title: "$experience.intro.title"
        subtitle: "$experience.intro.subtitle"
      - type: cta_block
        buttons:
          - text: "$experience.intro.button"
            link: /curriculum
            style: btn-primary
      - type: list_block
        layout: bento_grid
        item_type: feature_item
        items:
          - title: "$experience.item_spark.title"
            span: 4
            content: "$experience.item_spark.content"
            icon: lucide:sparkles
            media:
              type: image
              image: /img/artifacts/tw_waldorf_painting_1768617922808.webp
          - title: "$experience.item_mainbook.title"
            span: 4
            content: "$experience.item_mainbook.content"
            icon: lucide:book-open
            media:
              type: image
              image: /img/artifacts/tw_waldorf_drawing_workbook.webp
          - title: "$experience.item_crossing.title"
            span: 4
            content: "$experience.item_crossing.content"
            icon: lucide:mountain
            media:
              type: image
              image: /img/artifacts/tw_waldorf_climbing.webp
            buttons:
              - text: "$experience.item_crossing.button"
                link: /crossing
                style: btn-sm-outline
          - title: "$experience.item_seasonal.title"
            span: 6
            content: "$experience.item_seasonal.content"
            icon: lucide:calendar-check
            media:
              type: image
              image: /img/artifacts/tw_waldorf_nature_break.webp
            buttons:
              - text: "$experience.item_seasonal.button"
                link: /rhythm-of-life
                style: btn-sm-outline
          - title: "$experience.item_future_gap.title"
            span: 6
            content: "$experience.item_future_gap.content"
            icon: lucide:trending-up
            media:
              type: image
              image: /img/artifacts/tw_waldorf_graduates_success.webp
            buttons:
              - text: "$experience.item_future_gap.button"
                link: /future-paths
                style: btn-sm-outline
  - section_id: community
    layout: 精緻特色區塊 (Features Premium)
    blocks:
      - type: text_block
        title: "$community.intro.title"
        subtitle: "$community.intro.subtitle"
        content: "$community.intro.content"
      - type: cta_block
        buttons:
          - text: "$community.intro.button"
            link: /philosophy
            style: btn-primary
      - type: list_block
        layout: bento_grid
        item_type: feature_item
        align: center
        items:
          - title: "$community.item_connection.title"
            span: 4
            content: "$community.item_connection.content"
            icon: "lucide:users"
            media:
              type: image
              image: /img/artifacts/tw_teacher_parent_connection_1768617938384.webp
            buttons:
              - text: "$community.item_connection.button"
                link: /teacher-group
                style: btn-sm-outline
          - title: "$community.item_support.title"
            span: 4
            content: "$community.item_support.content"
            icon: "lucide:message-square"
            media:
              type: image
              image: /img/artifacts/tw_waldorf_community_support_1768617957981.webp
            buttons:
              - text: "$community.item_support.button"
                link: /rhythm-of-life
                style: btn-sm-outline
          - title: "$community.item_secure.title"
            span: 4
            content: "$community.item_secure.content"
            icon: "lucide:heart"
            media:
              type: image
              image: /img/artifacts/tw_calm_family_secure_1768617979428.webp
            buttons:
              - text: "$community.item_secure.button"
                link: /donation
                style: btn-sm-outline
  - section_id: ai_future
    layout: 精緻特色區塊 (Features Premium)
    align: center
    full_height: true
    overlay_color: "#ffffff99"
    parallax_ratio: 1
    media_list:
      - type: video
        video: /img/index/future-world.mp4
        mobileVideo: /img/index/future-world-mobile.mp4
        poster: /img/index/future-world-poster.webp
        mobilePoster: /img/index/future-world-poster-mobile.webp
    blocks:
      - type: text_block
        title: "$ai_future.intro.title"
        subtitle: "$ai_future.intro.subtitle"
        content: "$ai_future.intro.content"
        buttons:
          - text: "$ai_future.intro.button"
            link: /future-education
            style: btn-outline-primary
      - type: list_block
        layout: bento_grid
        item_type: feature_item
        items:
          - title: "$ai_future.item_soft_skills.title"
            span: 6
            content: "$ai_future.item_soft_skills.content"
            icon: lucide:brain-circuit
          - title: "$ai_future.item_adaptability.title"
            span: 6
            content: "$ai_future.item_adaptability.content"
            icon: lucide:compass
  - section_id: videos
    blocks:
      - type: text_block
        title: "$videos.intro.title"
        subtitle: "$videos.intro.subtitle"
        content: "$videos.intro.content"
        buttons:
          - text: "$videos.intro.button"
            link: /featured-courses
            style: btn-outline-primary
      - type: list_block
        layout: bento_grid
        item_type: video_item
        items:
          - title: "$videos.item_essence.title"
            span: 4
            media:
              type: youtube
              url: https://youtu.be/oermgcwIkC8
            duration: "08:05"
            content: "$videos.item_essence.content"
          - title: "$videos.item_golden_line.title"
            span: 4
            media:
              type: youtube
              url: https://youtu.be/atLmqSjhnxs
            duration: "02:47"
            content: "$videos.item_golden_line.content"
          - title: "$videos.item_revolution.title"
            span: 4
            media:
              type: youtube
              url: https://youtu.be/-kLpchWvdh4
            duration: "04:40"
            content: "$videos.item_revolution.content"
  - !include shared_section/testimonials.yml
  - section_id: faq
    blocks:
      - type: text_block
        title: "$faq.intro.title"
        subtitle: "$faq.intro.subtitle"
        content: "$faq.intro.content"
      - type: list_block
        layout: vertical
        item_type: faq_item
        faq_ids:
          - tuition
          - school-bus
          - curriculum
          - enrollment
          - graduates
          - transition
  - layout: 紫色大型看板 (CTA)
    blocks:
      - type: text_block
        title: "$cta_bottom.title"
        content: "$cta_bottom.content"
      - type: cta_block
        buttons:
          - text: "$cta_bottom.button"
            link: /visit
            style: btn-inverse
        subtext: "$cta_bottom.subtext"
