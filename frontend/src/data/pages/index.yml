title: "$seo.title"
slug: index
seo:
  title: "$seo.title"
  description: "$seo.description"
  keywords: 同心華德福, 台北實驗教育, 華德福教育, 深坑教育, 全人教育, 九年一貫, 108課綱
hero:
  title: "$hero.title"
  subtitle: "$hero.subtitle"
  buttons:
    - text: "$hero.button_visit"
      link: /visit
      style: btn-primary
  subtext: "$hero.subtext"
  media_list:
    - type: video
      video: /img/index/hero/hero-background.mp4
      mobileVideo: /img/index/hero/hero-mobile.mp4
      poster: /img/index/hero/hero-poster.webp
      mobilePoster: /img/index/hero/hero-poster-mobile.webp
  layout: "Hero: 左下方文字方塊 (首頁風格)"
  divider:
    type: wave
    position: bottom
    color: fill-brand-bg
sections:
  - section_id: stats_overview
    layout: 滿版 (Full width)
    className: "relative z-10 w-full"
    entry_animation: true
    blocks:
      - type: stats_block
        show_dividers: true
        items:
          - value: "$stats.years.value"
            unit: "$stats.years.unit"
            label: "$stats.years.label"
            description: "$stats.years.description"
          - value: "$stats.students.value"
            unit: "$stats.students.unit"
            label: "$stats.students.label"
            description: "$stats.students.description"
          - value: "$stats.ratio.value"
            unit: "$stats.ratio.unit"
            label: "$stats.ratio.label"
            description: "$stats.ratio.description"
  - section_id: experience
    layout: 精緻特色區塊 (Features Premium)
    blocks:
      - type: text_block
        title: "$experience.intro.title"
        subtitle: "$experience.intro.subtitle"
      - type: list_block
        layout: bento_grid
        item_type: feature_item
        items:
          - title: "$experience.item_spark.title"
            span: 4
            content: "$experience.item_spark.content"
            icon: lucide:sparkles
            media:
              type: image
              image: /img/artifacts/tw_waldorf_spark_curiosity.webp
          - title: "$experience.item_mainbook.title"
            span: 4
            content: "$experience.item_mainbook.content"
            icon: lucide:book-open
            media:
              type: image
              image: /img/artifacts/tw_waldorf_main_workbook.webp
          - title: "$experience.item_crossing.title"
            span: 4
            content: "$experience.item_crossing.content"
            icon: lucide:mountain
            media:
              type: image
              image: /img/artifacts/tw_waldorf_inner_hero.webp
            buttons:
              - text: "$experience.item_crossing.button"
                link: /crossing
                style: btn-sm-outline
          - title: "$experience.item_seasonal.title"
            span: 6
            content: "$experience.item_seasonal.content"
            icon: lucide:calendar-check
            media:
              type: image
              image: /img/artifacts/tw_waldorf_seasonal_break.webp
            buttons:
              - text: "$experience.item_seasonal.button"
                link: /rhythm-of-life
                style: btn-sm-outline
          - title: "$experience.item_future_gap.title"
            span: 6
            content: "$experience.item_future_gap.content"
            icon: lucide:trending-up
            media:
              type: image
              image: /img/artifacts/tw_waldorf_future_leader.webp
            buttons:
              - text: "$experience.item_future_gap.button"
                link: /future-paths
                style: btn-sm-outline
  - section_id: ai_future
    layout: 精緻特色區塊 (Features Premium)
    align: center
    full_height: true
    overlay_color: "#ffffff99"
    parallax_ratio: 1
    media_list:
      - type: video
        video: /img/index/future/future-world.mp4
        mobileVideo: /img/index/future/future-world-mobile.mp4
        poster: /img/index/future/future-world-poster.webp
        mobilePoster: /img/index/future/future-world-poster-mobile.webp
    blocks:
      - type: text_block
        title: "$ai_future.intro.title"
        subtitle: "$ai_future.intro.subtitle"
        content: "$ai_future.intro.content"
        buttons:
          - text: "$ai_future.intro.button"
            link: /future-education
            style: btn-outline-primary
      - type: list_block
        layout: bento_grid
        item_type: feature_item
        items:
          - title: "$ai_future.item_soft_skills.title"
            span: 6
            content: "$ai_future.item_soft_skills.content"
            icon: lucide:brain-circuit
          - title: "$ai_future.item_adaptability.title"
            span: 6
            content: "$ai_future.item_adaptability.content"
            icon: lucide:compass
  - section_id: videos
    blocks:
      - type: text_block
        title: "$videos.intro.title"
        subtitle: "$videos.intro.subtitle"
        content: "$videos.intro.content"
      - type: list_block
        layout: bento_grid
        item_type: video_item
        items:
          - title: "$videos.item_essence.title"
            span: 4
            media:
              type: youtube
              url: https://youtu.be/oermgcwIkC8
            duration: "08:05"
            content: "$videos.item_essence.content"
          - title: "$videos.item_golden_line.title"
            span: 4
            media:
              type: youtube
              url: https://youtu.be/atLmqSjhnxs
            duration: "02:47"
            content: "$videos.item_golden_line.content"
          - title: "$videos.item_revolution.title"
            span: 4
            media:
              type: youtube
              url: https://youtu.be/-kLpchWvdh4
            duration: "04:40"
            content: "$videos.item_revolution.content"
  - section_id: community
    layout: 精緻特色區塊 (Features Premium)
    blocks:
      - type: text_block
        title: "$community.intro.title"
        subtitle: "$community.intro.subtitle"
        content: "$community.intro.content"
      - type: list_block
        layout: bento_grid
        item_type: feature_item
        align: center
        items:
          - title: "$community.item_connection.title"
            span: 4
            content: "$community.item_connection.content"
            icon: "lucide:users"
            media:
              type: image
              image: /img/artifacts/tw_waldorf_parent_teacher_connection.webp
            buttons:
              - text: "$community.item_connection.button"
                link: /teacher-group
                style: btn-sm-outline
          - title: "$community.item_support.title"
            span: 4
            content: "$community.item_support.content"
            icon: "lucide:message-square"
            media:
              type: image
              image: /img/artifacts/tw_waldorf_community_village.webp
            buttons:
              - text: "$community.item_support.button"
                link: /rhythm-of-life
                style: btn-sm-outline
          - title: "$community.item_secure.title"
            span: 4
            content: "$community.item_secure.content"
            icon: "lucide:heart"
            media:
              type: image
              image: /img/artifacts/tw_waldorf_secure_family.webp
            buttons:
              - text: "$community.item_secure.button"
                link: /donation
                style: btn-sm-outline
  - !include shared_section/testimonials.yml
  - section_id: not_for_everyone
    layout: 精緻特色區塊 (Features Premium)
    className: "mx-auto max-w-[calc(100%-2rem)] lg:max-w-5xl bg-stone-100/80 dark:bg-stone-900/80 my-24 !py-16 rounded-[2.5rem] border border-stone-200 dark:border-stone-800 shadow-sm"
    blocks:
      - type: text_block
        title: "$not_for_everyone.intro.title"
        subtitle: "$not_for_everyone.intro.subtitle"
        content: "$not_for_everyone.intro.content"
      - type: list_block
        layout: bento_grid
        item_type: feature_item
        items:
          - title: "$not_for_everyone.item_grades.title"
            span: 4
            content: "$not_for_everyone.item_grades.content"
            icon: lucide:file-digit
          - title: "$not_for_everyone.item_hands_off.title"
            span: 4
            content: "$not_for_everyone.item_hands_off.content"
            icon: lucide:shopping-cart
          - title: "$not_for_everyone.item_status.title"
            span: 4
            content: "$not_for_everyone.item_status.content"
            icon: lucide:crown
      - type: cta_block
        buttons:
          - text: "$not_for_everyone.outro.button"
            link: /visit
            style: btn-primary
        subtext: "$not_for_everyone.outro.subtext"
  - section_id: faq
    blocks:
      - type: text_block
        title: "$faq.intro.title"
        subtitle: "$faq.intro.subtitle"
        content: "$faq.intro.content"
      - type: list_block
        layout: vertical
        item_type: faq_item
        faq_ids:
          - time
          - investment
          - graduates
          - adapt
          - visit
          - tuition
          - transition
  - layout: 紫色大型看板 (CTA)
    blocks:
      - type: text_block
        title: "$cta_bottom.title"
        content: "$cta_bottom.content"
      - type: cta_block
        buttons:
          - text: "$cta_bottom.button"
            link: /visit
            style: btn-inverse
        subtext: "$cta_bottom.subtext"
