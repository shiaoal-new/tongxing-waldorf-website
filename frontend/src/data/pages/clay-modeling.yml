title: "seo.title"
slug: clay-modeling
seo:
  title: "seo.title"
  description: "seo.description"
hero:
  title: "hero.title"
  subtitle: "hero.subtitle"
  accent_text: "hero.accent_text"
  media_list:
    - type: image
      image: /img/clay-modeling/hero.webp
  layout: "Hero: 中央圖文 (願景頁風格)"
  divider:
    type: wave
    position: bottom
    color: fill-brand-bg

sections:
  - section_id: concept
    layout: "精緻特色區塊 (Features Premium)"
    blocks:
      - type: text_block
        title: "concept.title"
        subtitle: "concept.subtitle"
        content: "concept.content"
      - type: list_block
        layout_method: bento_grid
        item_type: feature_item
        items:
          - title: "concept.item_non_talent.title"
            span: 6
            content: "concept.item_non_talent.content"
            icon: lucide:heart
          - title: "concept.item_breathing.title"
            span: 6
            content: "concept.item_breathing.content"
            icon: lucide:wind

  - section_id: grades
    layout: "精緻特色區塊 (Features Premium)"
    silk_background: true
    blocks:
      - type: text_block
        title: "grades.title"
        subtitle: "grades.subtitle"
      - type: list_block
        layout_method: bento_grid
        item_type: feature_item
        items:
          - title: "grades.g4.title"
            span: 6
            content: "grades.g4.content"
            icon: lucide:dog
            media:
              type: image
              image: /img/artifacts/tw_waldorf_painting_1768617922808.webp
          - title: "grades.g5.title"
            span: 6
            content: "grades.g5.content"
            icon: lucide:user
            media:
              type: image
              image: /img/featured-academic.webp

  - section_id: features
    layout: "精緻特色區塊 (Features Premium)"
    blocks:
      - type: text_block
        title: "features.title"
        subtitle: "features.subtitle"
      - type: list_block
        layout_method: bento_grid
        item_type: feature_item
        items:
          - title: "features.item_hands.title"
            span: 4
            content: "features.item_hands.content"
            icon: lucide:hand
          - title: "features.item_will.title"
            span: 4
            content: "features.item_will.content"
            icon: lucide:zap
          - title: "features.item_inner_image.title"
            span: 4
            content: "features.item_inner_image.content"
            icon: lucide:lightbulb

  - section_id: final
    layout: "Hero: 滿版背景圖文 (願景風格)"
    media_list:
      - type: image
        image: /img/vision-header.webp
    blocks:
      - type: text_block
        title: "summary.title"
        content: "summary.content"
      - type: cta_block
        buttons:
          - text: "summary.button"
            link: /
            style: btn-inverse
