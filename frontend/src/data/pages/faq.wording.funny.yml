faq:
  curriculum:
    title: "學校都在教什麼？(跟別人家很不一樣喔)"
    content: |
      別的學校可能在趕課，我們在「慢燉」知識。

      **早上主課程 (Morning Main Lesson)**
      連續 2 小時深度沈浸 (對，你沒聽錯，兩小時！)。這時候腦袋最清醒，適合把知識「吃」進去。

      **藝術魂爆發**
      音樂、濕水彩、手工...我們不是培養畫家，是為了讓孩子的手腦心一起動起來 (不然只用腦袋會過熱啊)。

      **特別來賓 - 優律思美**
      這不是一般的跳舞喔，是看得到的音樂，聽得見的動作 (很玄？來看了就知道)。

      **九年一貫懶人包**
      從 1 年級一路念到 9 年級。好處？情緒穩、老師熟、不用國小畢業哭一次分開，國中再哭一次 (省下不少衛生紙)。

      想看更硬派的課程介紹？請點：
      - [華德福教育介紹](https://waldorf.org.tw) 
      - [同心課程手冊](https://tongxin-waldorf.edu.tw/curriculum)

  enrollment:
    title: "心動了？教你怎麼把孩子送進來"
    content: |
      入學其實不難，最難的是「決定踏出這一步」 (我們懂，拍拍)。
      如果你準備好了，我們有三條路：

      1. **社恐友善版**：直接上 [官網](https://tongxin-waldorf.edu.tw) 填表單，默默送出。
      2. **熱情通話版**：打電話給辦公室，會有親切的聲音接聽 (只要不是忙線中)。
      3. **實地考察版**：預約來學校晃晃，確認一下這邊的磁場跟你們家合不合。

      **接下來呢？** 
      我們會辦說明會 (強制參加喔，為了更了解彼此)，還有面談 (不是隨堂考，只是聊聊教育理念)。

      詳細攻略請看：[招生簡章](https://tongxin-waldorf.edu.tw/admissions)

  graduates:
    title: "畢業後真的能生存嗎？(家長最愛問)"
    content: |
      這是 FAQ 榜首，我們完全不避諱 (推眼鏡)。

      ### Q: 競爭力夠嗎？
      A: 我們的孩子可能不會背全台灣所有河流的長度，但他們遇到問題會**思考**、會**找答案**、而且**不怕難**。在 AI 時代，這種「野外求生」的能力其實更值錢 (真心不騙)。

      ### Q: 那張紙 (學歷) 呢？
      A: 安啦！畢業證書跟大家一樣，政府認證，升學路上該有的都有。

      ### 數據會說話 (雖然我們不愛看冰冷的數字)

      | 特質 | 翻譯蒟蒻 |
      | :--- | :--- |
      | **獨當一面** | 遇到事情不是先喊「媽～」，是先想「怎麼辦」。 |
      | **團隊合作** | 神隊友潛力股，懂得聽別人的聲音。 |
      | **內在核心** | 心臟很大顆，面對變動的世界(火年)也不容易崩潰。 |

      **結論：**
      他們就像裝了越野輪胎的車，到了柏油路(體制內)可能一開始覺得稍微有點吵，但跑起來絕對沒問題，而且還能衝去別人去不了的地方！

  school-bus:
    title: "這是最殘酷的一題：有校車嗎？"
    content: |
      答案是：**沒有** (誠實豆沙包)。

      **但是！(人生總有轉折)**
      我們有強大的「家長共乘互助網」。
      這不只是省油錢，這是革命情感啊！

      「今天你幫我接孩子，下週我幫你送便當。」

      在接送的路上，孩子們有了玩伴，家長們有了戰友 (還有八卦對象)。
      雖然稍微考驗行政夥伴的心臟強度 (怕大家遲到)，但這就是我們溫暖(又有點混亂)的村莊生活。

  transition:
    title: "一定要念完九年嗎？中途想落跑(誤)怎麼辦？"
    content: |
      我們當然希望這是一場九年的長跑 (牽手不放開～)。
      提供 1-9 年級的穩定環境，就是為了讓孩子在發育期不用一直適應新環境，可以專心長大。

      **但在這變動的時代 (火年嘛)，計畫趕不上變化。**
      如果真的需要轉學，家長最擔心的是「跟不上」。

      **免驚！** 我們的經驗是：同心的孩子適應力**超、級、強**。

      因為他們已經建立了自己的學習節奏。到了新環境，他們或許需要一點點時間搞懂遊戲規則 (比如考試技巧)，但那份對學習的熱情和自信，會讓他們很快就發光。
      (而且通常會變成班上最有創意的那群人)

  tuition:
    title: "學費 (深呼吸...來看真相)"
    content: |
      談錢傷感情，但不談不行 (遞茶)。
      為了給孩子好的環境 (還有付老師薪水 XD)，我們的收費如下：

      - **小學部 (1-6年級)**：每學期 **85,000** 元
      - **中學部 (7-8年級)**：每學期 **95,000** 元 (孩子大了，吃的用的都變多了嘛)
      - **午餐費**：一餐 **90** 元 (堅持吃得健康，這錢省下來真的沒扁食好吃)

      這不是一筆小數目 (都可以買好多台 iPhone 了)。
      但我們承諾，每一塊錢都是為了點燃孩子眼裡的光。這是一場對未來的投資，而且... **回憶無價，保固一輩子！** (是不是覺得稍微划算了一點？)

  time:
    title: 「我工作很忙，真的有時間參與嗎？」
    content: 沒問題！我們精簡了那些冗長的廢話會議。每週 15 分鐘導師深度交流＋每學期幾場高品質的社群趴，讓你能高品質、不加班地參與孩子的成長（而且還能交到一群有趣的戰友喔）。

  investment:
    title: 「學費投資能回收嗎？」
    content: 說真的，與其想著「回收」，不如說是「免疫」！在 AI 時代，「敢於在沒答案的地方開路」的人最值錢。我們投資的是孩子的原創靈魂和反脆弱的能力，這份競爭力，市場保值度是 100% 哦。

  adapt:
    title: 「轉學孩子能適應嗎？」
    content: 安啦，華德福的孩子有一種「天然融合力」。80% 轉學生一學期內就找到頻率，開心地跟泥土和故事做朋友了。我們還有專門的「無縫適應包」，保證過渡期不會卡卡的。

  visit:
    title: 「參觀後發現不適合怎麼辦？」
    content: 歡迎來試水溫！不合適我們也會笑著送你出門的。我們的參觀零推銷、零壓力，純粹讓你親自感受這裡的「火」暖不暖，看完覺得頻率不對，我們也會祝福你找到更適合的教育村落。
