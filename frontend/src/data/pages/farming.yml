title: "$seo.title"
slug: farming
seo:
  title: "$seo.title"
  description: "$seo.description"
hero:
  title: "$hero.title"
  subtitle: "$hero.subtitle"
  accent_text: "$hero.accent_text"
  media_list:
    - type: image
      image: /img/farming/hero.webp
  layout: "Hero: 中央圖文 (願景頁風格)"
  divider:
    type: wave
    position: bottom
    color: fill-brand-bg

sections:
  - section_id: willpower
    layout: "精緻特色區塊 (Features Premium)"
    blocks:
      - type: text_block
        title: "$willpower.title"
        subtitle: "$willpower.subtitle"
        content: "$willpower.content"
      - type: list_block
        layout_method: bento_grid
        item_type: feature_item
        items:
          - title: "$willpower.item_crisis.title"
            span: 6
            content: "$willpower.item_crisis.content"
            icon: lucide:anchor
            media:
              type: image
              image: /img/artifacts/tw_waldorf_circle_1768617908506.webp
          - title: "$willpower.item_practice.title"
            span: 6
            content: "$willpower.item_practice.content"
            icon: lucide:hammer
            media:
              type: image
              image: /img/artifacts/tw_waldorf_gardening_1768617891526.webp

  - section_id: spiral
    layout: "精緻特色區塊 (Features Premium)"
    silk_background: true
    blocks:
      - type: text_block
        title: "$spiral.title"
        subtitle: "$spiral.subtitle"
        content: "$spiral.content"
      - type: list_block
        layout_method: bento_grid
        item_type: feature_item
        items:
          - title: "$spiral.item_creation.title"
            span: 4
            content: "$spiral.item_creation.content"
            icon: lucide:layers
          - title: "$spiral.item_bd.title"
            span: 4
            content: "$spiral.item_bd.content"
            icon: lucide:heart-pulse
          - title: "$spiral.item_respect.title"
            span: 4
            content: "$spiral.item_respect.content"
            icon: lucide:peace

  - section_id: horticulture
    layout: "精緻特色區塊 (Features Premium)"
    blocks:
      - type: text_block
        title: "$horticulture.title"
        subtitle: "$horticulture.subtitle"
        content: "$horticulture.content"
      - type: list_block
        layout_method: bento_grid
        item_type: feature_item
        items:
          - title: "$horticulture.item_integration.title"
            span: 6
            content: "$horticulture.item_integration.content"
            icon: lucide:microscope
          - title: "$horticulture.item_technique.title"
            span: 6
            content: "$horticulture.item_technique.content"
            icon: lucide:scissors

  - section_id: community
    layout: "精緻特色區塊 (Features Premium)"
    silk_background: true
    blocks:
      - type: text_block
        title: "$community.title"
        subtitle: "$community.subtitle"
        content: "$community.content"
      - type: list_block
        layout_method: bento_grid
        item_type: feature_item
        items:
          - title: "$community.item_cooperation.title"
            span: 6
            content: "$community.item_cooperation.content"
            icon: lucide:hand-metal
          - title: "$community.item_cycle.title"
            span: 6
            content: "$community.item_cycle.content"
            icon: lucide:utensils

  - section_id: final
    layout: "Hero: 滿版背景圖文 (願景風格)"
    media_list:
      - type: image
        image: /img/vision-header.webp
    blocks:
      - type: text_block
        title: "$summary.title"
        content: "$summary.content"
      - type: cta_block
        buttons:
          - text: "$summary.button"
            link: /
            style: btn-inverse
