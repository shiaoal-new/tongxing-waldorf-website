seo:
  title: 同心華德福 | 台北深坑華德福教育實驗機構
  description: 同心華德福致力於提供符合孩子身心發展的教育，透過完整的 1-9 年級九年一貫學制，培育具備平衡身心靈與創意思維的未來公民。

hero:
  title: 讓孩子成為在 AI 時代領航的「自由人」
  subtitle: 致正在為孩子尋找未來競爭力的家長
  button_visit: 預約參觀校園
  subtext: 在地耕耘 10+ 年 | 陪伴 1000+ 個孩子成長 | 全程約 60 分鐘，不含推銷

experience:
  intro:
    title: 別讓標準答案，消滅了孩子眼中的火種
    subtitle: 同心特有的教育體驗
    button: 深入了解 1-9 年級課程規劃
  item_spark:
    title: 奪回好奇心：點燃 100% 主動探究的教育火種
    content: 當知識變成枯燥的考卷，學習就成了負擔。我們從古老的象形文字起源引導，用故事與圖像取代死記，讓孩子對世界始終保持著 100%「想知道更多」的純真渴望。
  item_mainbook:
    title: 拒絕公版：在 AI 時代，培育機器無法複製的原創靈魂
    content: 當 AI 能在一秒內整合千篇一律的資訊，人類唯一的勝場在於「轉化」與「沈澱」。同心的孩子親手書寫並繪製專屬的「工作本」，這不只是課業紀錄，更是他們與知識深度對白後的生命結晶。透過這輩子的第一本「個人著作」，孩子將長出無可取代的原創精神，成為在 AI 時代中定義問題、而非僅是被動接收答案的領航者。
  item_crossing:
    title: 拒絕平庸：以年度跨越任務建構內在英雄
    content: 孩子需要知道自己「做得到」。透過每一學年量身打造的跨越任務，孩子在挑戰中克服恐懼，親自證實自己的成長，將內在能量轉化為現實世界的執行力。
    button: 了解各年級跨越任務
  item_seasonal:
    title: 擺脫疲憊節奏：每年 4 段深層連結的家庭黃金假
    content: 被塞滿的寒暑假並非真正的休息。我們設有符合生命律動的四季假，讓家庭每年擁有 4 段避開人潮的黃金時光，在最適宜的季節找回親子間深層的連結。
    button: 了解作息節奏
  item_future_gap:
    title: 終結未來憂慮：培育具備「反脆弱」特質的畢業生
    content: 家長的疑慮通常來自對未知的恐懼。華德福畢業生在銜接時展現出強大的環境韌性與自主學習力。他們不只是學術上的佼佼者，更是能駕馭未來多變局勢的引領者。
    button: 畢業生發展足跡

ai_future:
  intro:
    title: 2035 年，您的孩子將面對什麼樣的世界？
    subtitle: 給孩子 AI 模擬不來的生命力
    content: 在生成式 AI 瞬間完成重複性任務的時代，教育的重點不再是知識填充。同心致力於培養機器無法複製的人性核心：好奇心、創造力與強大的心理韌性。
    button: 探索 AI 時代的強項
  item_soft_skills:
    title: 培養「無法被自動化」的人性核心
    content: 機器擅長計算與邏輯，但人類擅長同理與直覺。我們在中學階段深耕藝術與思辨，讓孩子具備強大的感知能力，成為能駕馭工具而非被工具取代的人。
  item_adaptability:
    title: 具備「提出對的問題」的批判性思維
    content: 當 AI 能在毫秒間給出無數答案時，未來的領袖需要的是「辨識真偽」與「提出好問題」的能力。我們從中小學的跨領域專題開始，深耕獨立思考，讓孩子不只會解題，更能定義問題。

community:
  intro:
    title: 育兒不該是一場孤獨的馬拉松
    subtitle: 建立支持成長的師生社群
    content: 台北忙碌的生活讓家長在育兒與職場間疲於奔命，常感到焦慮與孤立。同心致力於建立一個「共學村落」，讓你在教育路上擁有最專業、最溫暖的戰友。
    button: 深入了解親師合作
  item_connection:
    title: 深度同理的親師戰友：每週 15 分鐘建立黃金溝通線
    content: 導師與家長維持精準且高頻的溝通。我們不聊廢話，而是聚焦學生的心理成長與家庭支持。比起無效的家長會，這裡每週 15 分鐘的深度交流，能為孩子建立一條守護 9 年的健康黃金線。
    button: 認識教育團隊
  item_support:
    title: 實踐共學共榮：超過 95% 家長推薦的支撐網絡
    content: 教育不該是一場孤獨的修行。同心社群展現了高達 95% 以上的互助滿意度，家長之間共享資源與支援。在台北這座孤島，我們為您找回一個能互相依靠、共同把孩子養大的「教育村落」。
    button: 了解校園生活
  item_secure:
    title: 建立 100% 的信任感：轉化焦慮為成長動能
    content: 當大人不再焦慮，孩子才能 100% 放心長大。我們透過社群的力量，將家長對升學與未來的焦慮，轉化為陪伴孩子成長的穩定動能，為學子營造出充滿信任、愛與安定的成長沃土。
    button: 支持教育願景

videos:
  intro:
    title: 見證學習的真實
    subtitle: 華德福教學現場直擊
    content: 我們透過影像紀錄，真實呈現在校園中發生的教學火花與師生對話。透過這些珍貴的鏡頭，您可以更直觀地理解華德福教育如何溫潤地與心靈接軌。
    button: 探索課程設計
  item_essence:
    title: 累積 1000+ 日的操作紀錄：九年一貫教育精華
    content: 透過 8 分鐘的紀實短片，看見我們如何在這 9 年、超過 3000 個日子裡，平衡學力培育與身心發展，展現華德福教育在台灣本土實踐的豐碩成果。
  item_golden_line:
    title: 師生之間的生命連結
    content: 探討華德福導師與班級學生之間深厚的契合度，這種長期且穩定的陪伴，是發展心理學中至關重要的基石。
  item_revolution:
    title: 中學時期的個體化思辨過程
    content: 紀錄中學生如何在藝術專題與理科探究中，逐步發展出獨立思考的能力與對自我的認同感。

not_for_everyone:
  intro:
    title: 說實話，我們可能不適合您
    subtitle: 尋找價值觀契合的同行者
    content: 同心華德福並非傳統私立學校，這條獨特的教育路徑需要極高的共識。若您對教育的期待屬於以下三種類型，我們誠實地建議您可能要再多考慮：
  item_grades:
    title: 僅追求完美分數與升學排名
    content: 若您認為學業的重點是贏在起跑點、提早刷題與頻繁測驗，我們的學習節奏可能會讓您感到焦慮。我們重視的是「不搶拍」的內化過程。
  item_hands_off:
    title: 尋找「全包式」升學保母服務
    content: 我們不提供將教育外包的選項。同心的教育是一場「親、師、生」的三方共工，需要家長願意投入時間參與社群、共同成長。
  item_status:
    title: 期望用私校標籤建立階級感
    content: 若您尋找的是強調菁英感與升學貴族的學校，同心會讓您失望。我們是一群踏實的泥土家長，重視樸實、自然，並讓孩子學會捲起袖子解決問題。
  outro:
    subtext: 如果以上三點都不是您，恭喜，我們非常期待認識您。歡迎加入這場翻轉教育的旅程。
    button: 這正是我在尋找的，預約參觀

faq:
  intro:
    title: 放心，您的疑慮我們都聽見了
    subtitle: 在預約參觀前，先解答您心裡的幾個問號
    content: 每個家庭在選擇教育時都會有顧慮，這些問題我們已經回答過無數次。以下的解答，是為了讓您更安心地邁出這一步。

cta_bottom:
  title: 親身體驗教育的溫度
  content: 您可以直接蒞臨新北市深坑大學校區，透過實地觀課與導覽，感受華德福教育現場特有的安靜力量與活力。
  button: 立即預約校園參觀
  subtext: 免費預約，由資深導師親自導覽
