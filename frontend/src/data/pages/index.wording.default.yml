seo:
  title: 同心華德福 | 台北深坑華德福教育實驗機構
  description: 同心華德福致力於提供符合孩子身心發展的教育，透過完整的 1-9 年級九年一貫學制，培育具備平衡身心靈與創意思維的未來公民。

hero:
  title: 同心華德福
  subtitle: 於自然的節奏中，培育穩定且有創意的自由人
  accent_text: 領航新北深坑的實驗教育願景
  button_visit: 預約參觀校園

features:
  intro:
    title: 紮根土地的教育
    subtitle: 教育核心特色
  item_university:
    title: 大學校園資源的一體化應用
    content: 充分整合大學校區的實驗室、藝術空間與廣大校地，讓學生的學習不受教室圍牆限制。在豐富的自然生態與學術氛圍中，培養孩子與環境和諧共處的能力，建立全方位的認知基礎。
    button: 預約正式參觀
  item_curriculum:
    title: 全面對接 108 課綱之素養教育
    content: 華德福教育的核心理念與 108 課綱的「自發、互動、共好」精神高度契合。我們透過實踐導向的學習，強化學生的自主學習動機與心理素質，將學科知識轉化為真實的生活執行力。
    button: 探討教育理念
  item_marathon:
    title: 穩定的九年一貫發展路徑
    content: 我們提供從國小到國中的連貫教育鏈，確保課程設計符合不同年齡層的發展門檻。透過師生的長久陪伴與信任關係，點燃孩子對知識探究的終身熱情，為其成人生活奠定穩固基礎。
    button: 瀏覽課程綱要
ai_future:
  intro:
    title: 2035 年，您的孩子將面對什麼樣的世界？
    subtitle: 給孩子 AI 模擬不來的生命力
    content: 在生成式 AI 能瞬間完成重複性任務的時代，教育的重點不再是知識填充，而是培養那些機器無法複製的人性核心：好奇心、創造力與強大的心理韌性。
    button: 探索 AI 時代的強項

community:
  intro:
    title: 建立支持成長的社群 - 親師共學
    subtitle: 溫暖而專業的互助體系
    content: 教育不應只是學校的責任。在忙碌的城市生活中，同心致力於建立一個支援網絡，讓家長在育兒過程中不再感到孤立。我們邀請家庭走進校園，共同營造一個穩定且充滿支持力量的成長村落。
    button: 深入了解親師合作
  item_connection:
    title: 深度同理的親師戰友關係
    content: 導師與家長維持緊密的溝通頻率，除了關注學生的在校表現，更重視家庭教育的協調與心理支持。透過專業與溫度的結合，我們共同為孩子的成長守護一條健康的黃金線。
    button: 認識教育團隊
  item_support:
    title: 實踐共學、共好、共榮的社區精神
    content: 校園社群展現了深厚的人際支援與互惠行為，家長之間共享育兒經驗與生活支援。這不僅是家庭間的互助，更是透過身教，讓孩子在充滿安全感與社會連覺的環境中成長。
    button: 了解校園生活
  item_secure:
    title: 建立穩固的情感連結與安全感
    content: 研究顯示，當家長具備穩定的支持系統時，孩子的內在連結感將更為強韌。同心透過社群的力量，轉化家長的育兒焦慮為成長動能，為學子營造出充滿信任、愛與安定的成長沃土。
    button: 支持教育願景

videos:
  intro:
    title: 見證學習的真實
    subtitle: 華德福教學現場直擊
    content: 我們透過影像紀錄，真實呈現在校園中發生的教學火花與師生對話。透過這些珍貴的鏡頭，您可以更直觀地理解華德福教育如何溫潤地與心靈接軌。
    button: 探索課程設計
  item_essence:
    title: 同心華德福：九年一貫教育精華
    content: 透過 8 分鐘的紀實短片，深入了解機構如何平衡學力培育與身心發展，展現華德福教育在台灣本土實踐的豐碩成果。
  item_golden_line:
    title: 師生之間的生命連結
    content: 探討華德福導師與班級學生之間深厚的契合度，這種長期且穩定的陪伴，是發展心理學中至關重要的基石。
  item_revolution:
    title: 中學時期的個體化思辨過程
    content: 紀錄中學生如何在藝術專題與理科探究中，逐步發展出獨立思考的能力與對自我的認同感。

testimonials:
  intro:
    title: 華德福家長與教師見證
    subtitle: 真誠而深刻的成長故事
  items:
    - quote: 「我的孩子曾在體制內變得排斥學習，甚至說自己是笨蛋。轉來同心後，我看見他在寫工作本時，臉上竟然是發著光的。這裡沒有標準答案的束縛，讓孩子找回了學習的胃口與熱情。」
      author: 秀萍
      title: 資深家長 (三個孩子皆就讀同心)
    - quote: 「參與學校事務看似勞累，但其實也是一種『得到』。在陪伴孩子長大的過程中，我也重新經歷了一次童年，並學會與自己的內在和解。這裡不只是一所學校，更是一個讓全家人共同成長的村落。」
      author: 林妙禪
      title: 家長 (陪伴學校一路成長的資深夥伴)
    - quote: 「在陪伴孩子完成『台北大縱走』的過程中，我看見孩子即便身體不適仍堅持走完，同學之間也互相攙扶。這裡的教育不只在課本裡，而是透過雙腳與土地的連結，長出真實的意志力與互助精神。」
      author: 佩佩
      title: 家長 (參與五年級大縱走隨行家長)
    - quote: 「華德福教育不是一套死的教材教法，而是『理解孩子』的過程。我們不以成績定義人，而是看見每個生命獨特的樣子，協助他們長成自己想成為的模樣。」
      author: 建龍 老師
      title: 資深導師
    - quote: 「當我拿起木工刀或毛線針時，我不只是在教技能，是在傳遞一種生命的節奏與定力。孩子看著老師認真工作的背影，他們也會學會如何安定自己的心，去創造美的事物。」
      author: 佩宜 老師
      title: 手工與藝術教師
    - quote: 「在戲劇排演中，我看到害羞的孩子站上舞台發光，看到衝動的孩子學會等待與對位。藝術治療了靈魂，讓教育不只是灌輸，而是內在力量的噴發。」
      author: 古峰 老師
      title: 戲劇課教師
    - quote: 「同心最核心的價值在於『民主參與』。我們建立了一個親、師、生三元合作的社群，讓老師覺得自己是主人，讓家長成為夥伴。因為有這份信任，同心的師資與社群力量一直相當穩定且溫暖。」
      author: 鄭同僚 教授
      title: 國立政治大學教育學系副教授、同心創辦人
    - quote: 「我們不需用過去的經驗限制孩子的未來。華德福教育培養的是孩子『自轉』的能力與『解決問題』的創意。當孩子知道自己是誰、對世界保有熱情，他們在任何時代都能找到自己的立足之地。」
      author: 王智弘 老師
      title: 資深華德福導師
    - quote: 「同心致力於提升教學品質，我們引進國外資深顧問與全球華德福社群連結（如 ICW 計畫），同時深耕台北在地文化。我們的願景是支持孩子從幼兒園一路長成具備國際視野與在地根基的自由人。」
      author: 詹雅智 老師
      title: 同心執行長

faq:
  intro:
    title: 常見問答整理與解惑
    subtitle: 關於入學與教學的詳細說明
    content: 針對學費結構、畢業銜接及課程設計等家長關切議題，我們提供詳盡且透明的說明，協助您做出最適合家庭與孩子的教育抉擇。

cta_bottom:
  title: 親身體驗教育的溫度
  content: 您可以直接蒞臨新北市深坑大學校區，透過實地觀課與導覽，感受華德福教育現場特有的安靜力量與活力。
  button: 立即預約校園參觀
