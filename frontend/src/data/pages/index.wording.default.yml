seo:
  title: 同心華德福 | 台北深坑華德福教育實驗機構
  description: 同心華德福致力於提供符合孩子身心發展的教育，透過完整的 1-9 年級九年一貫學制，培育具備平衡身心靈與創意思維的未來公民。

hero:
  title: 同心華德福
  subtitle: 於自然的節奏中，培育穩定且有創意的自由人
  accent_text: 領航新北深坑的實驗教育願景
  button_visit: 預約參觀校園
  subtext: 全程約 60 分鐘，不含任何推銷程序

features:
  intro:
    title: 您的孩子，是否正與真實的世界脫節？
    subtitle: 紮根土地的素養教育
  item_university:
    title: 拒絕圍牆：在 5 萬坪自然校園中長大
    content: 都市孩子的視野常被螢幕與水泥牆限制。我們充分整合大學校區的廣大校地與生態系統，讓學生的感官在泥土與微風中甦醒，建立 AI 時代最欠缺的「真實體覺」。
    button: 預約正式參觀
  item_curriculum:
    title: 告別死讀書：將 108 課綱轉化為實踐力
    content: 傳統學科往往與現實脫鉤。我們透過實踐導向的學習，將抽象知識轉化為孩子手部與心理的執行力，讓素養不再是口號，而是解決真實問題的能力。
    button: 探討教育理念
  item_marathon:
    title: 終結轉銜焦慮：穩定的九年一貫陪伴
    content: 頻繁更換教育環境常讓孩子與家長充滿不安。我們提供從小學到國中的長久陪伴，讓師生建立深厚信任，守護孩子在不同發展門檻下最需要的心理安全感。
    button: 瀏覽課程綱要

experience:
  intro:
    title: 別讓標準答案，消滅了孩子眼中的火種
    subtitle: 同心特有的教育體驗
  item_spark:
    title: 奪回好奇心：從象形到詩篇的感官之旅
    content: 當知識變成枯燥的考卷，學習就成了負擔。我們從古老的象形文字起源引導，用故事與圖像取代死記，讓孩子對世界始終保持著「想知道更多」的純真渴望。
  item_mainbook:
    title: 拒絕公版：親手書寫這輩子的第一本著作
    content: 機器生成的筆記沒有靈魂。在同心，每個孩子都親手繪製出專屬的「工作本」。這不僅是課業紀錄，更是他們與知識深度對話後的生命結晶，培養無可取代的原創精神。
  item_crossing:
    title: 拒絕平庸：以年度跨越任務建構內在英雄
    content: 孩子需要知道自己「做得到」。透過每一學年量身打造的跨越任務，孩子在挑戰中克服恐懼，親自證實自己的成長，將內在能量轉化為現實世界的執行力。
    button: 了解各年級跨越任務
  item_seasonal:
    title: 擺脫疲憊節奏：人性化的四季假與家庭質感
    content: 被塞滿的寒暑假並非真正的休息。我們設有符合生命律動的四季假，讓家庭能避開人擠人的尖峰，在最適宜的季節全心陪伴孩子，找回親子間失落已久的深層連結。
    button: 了解作息節奏
  item_future_gap:
    title: 終結未來憂慮：培育具備「反脆弱」特質的畢業生
    content: 家長的疑慮通常來自對未知的恐懼。華德福畢業生在銜接時展現出強大的環境韌性與自主學習力。他們不只是學術上的佼佼者，更是能駕馭未來多變局勢的引領者。
    button: 畢業生發展足跡

ai_future:
  intro:
    title: 2035 年，您的孩子將面對什麼樣的世界？
    subtitle: 給孩子 AI 模擬不來的生命力
    content: 在生成式 AI 瞬間完成重複性任務的時代，教育的重點不再是知識填充。同心致力於培養機器無法複製的人性核心：好奇心、創造力與強大的心理韌性。
    button: 探索 AI 時代的強項
  item_soft_skills:
    title: 培養「無法被自動化」的人性核心
    content: 機器擅長計算與邏輯，但人類擅長同理與直覺。我們在中學階段深耕藝術與思辨，讓孩子具備強大的感知能力，成為能駕馭工具而非被工具取代的人。
  item_adaptability:
    title: 讓家長安心：廣闊且韌性的未來路徑
    content: 畢業生在銜接高中或大學時，展現出遠超同齡人的環境適應力。這種教育方式不是遠離世界，而是賦予孩子在未來多變環境中「求生且茁壯」的真實武器。

community:
  intro:
    title: 育兒不該是一場孤獨的馬拉松
    subtitle: 建立支持成長的師生社群
    content: 台北忙碌的生活讓家長在育兒與职场間疲於奔命，常感到焦慮與孤立。同心致力於建立一個「共學村落」，讓你在教育路上擁有最專業、最溫暖的戰友。
    button: 深入了解親師合作
  item_connection:
    title: 深度同理的親師戰友關係
    content: 導師與家長維持緊密的溝通頻率，除了關注學生的在校表現，更重視家庭教育的協調與心理支持。透過專業與溫度的結合，我們共同為孩子的成長守護一條健康的黃金線。
    button: 認識教育團隊
  item_support:
    title: 實踐共學、共好、共榮的社區精神
    content: 校園社群展現了深厚的人際支援與互惠行為，家長之間共享育兒經驗與生活支援。這不僅是家庭間的互助，更是透過身教，讓孩子在充滿安全感與社會連覺的環境中成長。
    button: 了解校園生活
  item_secure:
    title: 建立穩固的情感連結與安全感
    content: 研究顯示，當家長具備穩定的支持系統時，孩子的內在連結感將更為強韌。同心透過社群的力量，轉化家長的育兒焦慮為成長動能，為學子營造出充滿信任、愛與安定的成長沃土。
    button: 支持教育願景

videos:
  intro:
    title: 見證學習的真實
    subtitle: 華德福教學現場直擊
    content: 我們透過影像紀錄，真實呈現在校園中發生的教學火花與師生對話。透過這些珍貴的鏡頭，您可以更直觀地理解華德福教育如何溫潤地與心靈接軌。
    button: 探索課程設計
  item_essence:
    title: 同心華德福：九年一貫教育精華
    content: 透過 8 分鐘的紀實短片，深入了解機構如何平衡學力培育與身心發展，展現華德福教育在台灣本土實踐的豐碩成果。
  item_golden_line:
    title: 師生之間的生命連結
    content: 探討華德福導師與班級學生之間深厚的契合度，這種長期且穩定的陪伴，是發展心理學中至關重要的基石。
  item_revolution:
    title: 中學時期的個體化思辨過程
    content: 紀錄中學生如何在藝術專題與理科探究中，逐步發展出獨立思考的能力與對自我的認同感。

faq:
  intro:
    title: 常見問答整理與解惑
    subtitle: 關於入學與教學的詳細說明
    content: 針對學費結構、畢業銜接及課程設計等家長關切議題，我們提供詳盡且透明的說明，協助您做出最適合家庭與孩子的教育抉擇。

cta_bottom:
  title: 親身體驗教育的溫度
  content: 您可以直接蒞臨新北市深坑大學校區，透過實地觀課與導覽，感受華德福教育現場特有的安靜力量與活力。
  button: 立即預約校園參觀
  subtext: 免費預約，由資深導師親自導覽
