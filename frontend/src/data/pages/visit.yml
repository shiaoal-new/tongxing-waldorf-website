title: $title
slug: visit
content: $content
hero:
  title: $hero.title
  subtitle: $hero.eyebrow
  description: $hero.sub_title
  buttons:
    - text: "立即預約深度參訪"
      link: "#schedule"
      style: "btn-primary"
  media_list:
    - type: image
      image: /img/visit.webp
  layout:
    wrapper_class: "max-w-3xl text-center"
    container_class: "items-center justify-center justify-self-center self-center"
sections:
  - section_id: process
    blocks:
      - type: text_block
        title: $process.blocks.0.title
        subtitle: $process.blocks.0.subtitle
        content: $process.blocks.0.content
      - type: visit_process_block
  - section_id: schedule
    blocks:
      - type: text_block
        title: $schedule.blocks.0.title
        subtitle: $schedule.blocks.0.subtitle
        content: $schedule.blocks.0.content
      - type: cal_com_block
        namespace: "學校參訪"
        calLink: "albert-siao/學校參訪"
