title: "seo.title"
slug: future-paths
seo:
  title: "seo.title"
  description: "seo.description"
hero:
  title: "hero.title"
  subtitle: "hero.subtitle"
  accent_text: "hero.accent_text"
  media_list:
    - type: image
      image: /img/future-paths/hero.png
  layout: "Hero: 中央圖文 (願景頁風格)"
  divider:
    type: wave
    position: bottom
    color: fill-brand-bg

sections:
  - section_id: waldorf
    layout: "精緻特色區塊 (Features Premium)"
    blocks:
      - type: text_block
        title: "waldorf.title"
        subtitle: "waldorf.subtitle"
        content: "waldorf.content"
      - type: list_block
        layout_method: bento_grid
        item_type: feature_item
        items:
          - title: "waldorf.item_yuguang.title"
            span: 4
            content: "waldorf.item_yuguang.content"
            icon: lucide:graduation-cap
          - title: "waldorf.item_shi.title"
            span: 4
            content: "waldorf.item_shi.content"
            icon: lucide:award
          - title: "waldorf.item_li.title"
            span: 4
            content: "waldorf.item_li.content"
            icon: lucide:pencil-ruler

  - section_id: adaptation
    layout: "精緻特色區塊 (Features Premium)"
    silk_background: true
    blocks:
      - type: text_block
        title: "adaptation.title"
        subtitle: "adaptation.subtitle"
        content: "adaptation.content"
      - type: list_block
        layout_method: bento_grid
        item_type: feature_item
        items:
          - title: "adaptation.item_transfer.title"
            span: 4
            content: "adaptation.item_transfer.content"
            icon: lucide:book-open
          - title: "adaptation.item_academic_case.title"
            span: 4
            content: "adaptation.item_academic_case.content"
            icon: lucide:trending-up
          - title: "adaptation.item_hk_case.title"
            span: 4
            content: "adaptation.item_hk_case.content"
            icon: lucide:globe

  - section_id: roadmap
    layout: "精緻特色區塊 (Features Premium)"
    blocks:
      - type: text_block
        title: "roadmap.title"
        subtitle: "roadmap.subtitle"
      - type: mermaid_block
        chart: "roadmap.chart"

  - section_id: pathway
    layout: "精緻特色區塊 (Features Premium)"
    blocks:
      - type: text_block
        title: "pathway.title"
        subtitle: "pathway.subtitle"
        content: "pathway.content"
      - type: list_block
        layout_method: bento_grid
        item_type: feature_item
        items:
          - title: "pathway.item_special.title"
            span: 4
            content: "pathway.item_special.content"
            icon: lucide:star
          - title: "pathway.item_stats.title"
            span: 4
            content: "pathway.item_stats.content"
            icon: lucide:bar-chart-3
          - title: "pathway.item_diverse.title"
            span: 4
            content: "pathway.item_diverse.content"
            icon: lucide:rocket

  - section_id: support
    layout: "精緻特色區塊 (Features Premium)"
    silk_background: true
    blocks:
      - type: text_block
        title: "support.title"
        subtitle: "support.subtitle"
        content: "support.content"
      - type: list_block
        layout_method: bento_grid
        item_type: feature_item
        items:
          - title: "support.advice_transition.title"
            span: 6
            content: "support.advice_transition.content"
            icon: lucide:coffee
          - title: "support.advice_rhythm.title"
            span: 6
            content: "support.advice_rhythm.content"
            icon: lucide:heart
          - title: "support.advice_coop.title"
            span: 6
            content: "support.advice_coop.content"
            icon: lucide:users
          - title: "support.item_awareness.title"
            span: 6
            content: "support.item_awareness.content"
            icon: lucide:eye

  - section_id: final
    layout: "Hero: 滿版背景圖文 (願景風格)"
    media_list:
      - type: image
        image: /img/vision-header.webp
    blocks:
      - type: text_block
        title: "summary.title"
        content: "summary.content"
      - type: cta_block
        buttons:
          - text: "summary.button"
            link: /
            style: btn-inverse
