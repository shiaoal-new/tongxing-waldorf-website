content: |
  在自然中看見真我，身體力行實踐知識；感受靈性引領前行，陪伴守護每一份純真。
  願孩子們安穩德厚如大地，靈思妙想似泉湧。同心溫暖如篝火，燦笑和煦似微風。
  觀察身邊的每一件事物，並以同理寬容的心，友善回應。
