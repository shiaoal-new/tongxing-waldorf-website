name: Firebase Hosting Deploy

on:
  push:
    branches:
      - main
      - dev

# 給予 workflow 寫入權限以推送 Git Notes
permissions:
  contents: write # 允許推送 Git Notes

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 取得程式碼
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 需要完整歷史記錄以使用 git notes
          token: ${{ secrets.GITHUB_TOKEN }} # 使用 GitHub token 以獲得推送權限
          persist-credentials: true # 保持認證資訊以便後續推送

      # 2. 配置 Git
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 3. 安裝 Node.js
      - uses: actions/setup-node@v3
        with:
          node-version: "20"

      # 4. 安裝依賴 (包含前端與後端)
      - run: npm run install:all

      # 5. 依 branch 做 build/export
      - name: Build & Export
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            export NEXT_PUBLIC_APP_ENV=dev
          fi
          export NEXT_PUBLIC_ACTION_RUN_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          npm run build

      # 6. 安裝 Firebase CLI
      - run: npm install -g firebase-tools

      # 7. 部署到對應專案 (Hosting + Functions)
      - name: Firebase Deploy
        id: deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # 根據 branch 決定使用哪個別名 (alias)
          ALIAS=${{ (github.ref_name == 'main' && 'prod') || 'dev' }}

          # 從 .firebaserc 解析出 Project ID (使用 jq)
          PROJECT_ID=$(jq -r ".projects[\"$ALIAS\"]" .firebaserc)
          echo "目標項目: $PROJECT_ID"

          # 執行部署
          firebase use $ALIAS --token $FIREBASE_TOKEN
          firebase deploy --only hosting,functions --token $FIREBASE_TOKEN --force

          # 將網址設置為 output
          echo "hosting_url=https://$PROJECT_ID.web.app" >> $GITHUB_OUTPUT

      # 8. 記錄部署成功結果到 Git Notes
      - name: Add Success Note
        if: success()
        run: |
          DEPLOY_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          BRANCH="${GITHUB_REF##*/}"
          NOTE_MSG="🚀 部署成功
          環境: $BRANCH
          時間: $DEPLOY_TIME
          Workflow: ${{ github.workflow }}
          Run ID: ${{ github.run_id }}
          Actor: ${{ github.actor }}"

          # 先拉取遠端 notes 以避免衝突
          git fetch origin refs/notes/deployments:refs/notes/deployments || true

          # 添加或追加 note
          git notes --ref=deployments add -m "$NOTE_MSG" ${{ github.sha }} || git notes --ref=deployments append -m "$NOTE_MSG" ${{ github.sha }}

          # 推送 notes,如果失敗則重試
          for i in {1..3}; do
            if git push origin refs/notes/deployments; then
              echo "✅ Notes 推送成功"
              break
            else
              echo "⚠️  推送失敗,重試 $i/3..."
              git fetch origin refs/notes/deployments:refs/notes/deployments || true
              sleep 2
            fi
          done

      # 9. 運行 Lighthouse 評估
      - name: Run Lighthouse Audit
        if: success()
        id: lighthouse
        continue-on-error: true
        env:
          LIGHTHOUSE_URL: ${{ steps.deploy.outputs.hosting_url }}
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
        run: |
          cd frontend
          npm run lighthouse:all

      # 10. 將報告上傳為 GitHub Artifacts
      - name: Upload Lighthouse Reports
        if: always() && (steps.lighthouse.outcome == 'success' || steps.lighthouse.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ github.ref_name }}-${{ github.run_id }}
          path: frontend/measurement_result/
          retention-days: 30

      # 11. 將摘要添加到 GitHub Action Job Summary
      - name: Add Summary to Action
        if: always() && (steps.lighthouse.outcome == 'success' || steps.lighthouse.outcome == 'failure')
        run: |
          SUMMARY_FILE=$(ls frontend/measurement_result/lighthouse_summary_*.md 2>/dev/null | head -n 1)
          if [ -f "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No Lighthouse summary found" >> $GITHUB_STEP_SUMMARY
          fi

      # 12. 記錄部署失敗結果到 Git Notes
      - name: Add Failure Note
        if: failure()
        run: |
          DEPLOY_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          BRANCH="${GITHUB_REF##*/}"
          NOTE_MSG="❌ 部署失敗
          環境: $BRANCH
          時間: $DEPLOY_TIME
          Workflow: ${{ github.workflow }}
          Run ID: ${{ github.run_id }}
          Actor: ${{ github.actor }}
          查看詳情: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # 先拉取遠端 notes 以避免衝突
          git fetch origin refs/notes/deployments:refs/notes/deployments || true

          # 添加或追加 note
          git notes --ref=deployments add -m "$NOTE_MSG" ${{ github.sha }} || git notes --ref=deployments append -m "$NOTE_MSG" ${{ github.sha }}

          # 推送 notes,如果失敗則重試
          for i in {1..3}; do
            if git push origin refs/notes/deployments; then
              echo "✅ Notes 推送成功"
              break
            else
              echo "⚠️  推送失敗,重試 $i/3..."
              git fetch origin refs/notes/deployments:refs/notes/deployments || true
              sleep 2
            fi
          done
